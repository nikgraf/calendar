version: 2
updates:
  # Third-party actions are SHA-pinned; Dependabot moves the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  # Grouped so one PR per week covers the workspace. The group used to
  # take everything, so it always carried an update the platform cannot
  # take yet and never merged (#75, #87, #98, #105) — patches it could
  # take never landed either. It now holds only what can merge as is; the
  # rest is a deliberate sweep (docs/decisions.md, "Dependency sweep").
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ['*']
    ignore:
      # effect stays pinned exactly via the pnpm catalog: all effect*
      # move together, by hand.
      - dependency-name: 'effect'
      - dependency-name: '@effect/*'
      # The workspace overrides vitest to the catalog, which must equal the
      # vitest vite-plus bundles: the two move together, by hand.
      - dependency-name: 'vite-plus'
      - dependency-name: 'vitest'
      # Majors (Babel, op-sqlite — whose Effect adapter wants < 18 — and
      # the like) come with the sweep, one commit each.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # The Expo SDK decides the React Native stack (`npx expo install
      # --check`): patches only until the next SDK.
      - dependency-name: 'react'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@react-native-community/*'
        update-types: ['version-update:semver-minor']
    labels: [dependencies]
