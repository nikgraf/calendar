name: Queue search

# The seeded sequence test of the pending-op queue
# (packages/sync/src/queueSequence.test.ts) over 7,000 seeds. The gate
# runs its first 50 on every push; what a change breaks past them showed
# only in a wider search run by hand, or in review. Nightly — but only
# when main moved since the last completed run — and on demand from the
# Actions tab. A failing seed prints its
# whole sequence and the command that replays it.
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: How many seeds
        default: '7000'

permissions:
  contents: read
  # `gh run list` in the decide job.
  actions: read

concurrency:
  group: queue-search
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The sha the last finished nightly (or manual) run searched.
          last=$(gh run list --repo "$REPO" --workflow queue-search.yml --branch main \
            --status completed --json headSha,conclusion --limit 30 \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // empty') || last=""
          if [ "$last" = "$SHA" ]; then
            echo "main has not moved since the last search ($SHA)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  search:
    name: Search the seeds
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the sequences
        env:
          QUEUE_SEQUENCE_RUNS: ${{ inputs.runs || '7000' }}
          # The seeds the test file lists as known are searched too.
          QUEUE_SEQUENCE_KNOWN: '1'
        run: pnpm exec vp test run packages/sync/src/queueSequence.test.ts
