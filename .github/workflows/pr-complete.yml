name: PR complete

# A ready PR fails this check while its body still owes something: the
# "What changes for the user" section first, both review stages, a
# screenshot (or a reason) for each platform whose UI it touches, and a
# docs/decisions.md line citing its number (scripts/prComplete.ts,
# .agents/skills/ship-pr/SKILL.md). Nik merges a green PR that looks done,
# so what is owed has to show here, not as a note in the body.
#
# The verdict is a commit status named `PR complete` on the PR's head,
# posted by the job; the job itself passes (a fork's PR excepted, below).
# GitHub counts every check run on a commit, earlier ones too, so a run
# that failed before the body was fixed (#352), or one cancelled by the
# next event (#347), kept the PR red after a later run passed. A status
# replaces the one before it under the same name. So nothing cancels a
# run either: each reads the PR from the API, and reads it again before it
# posts; if the body, head, labels or draft state changed in between, the
# run that change started posts instead. Every such change is a trigger
# below, `converted_to_draft` too.
#
# Editing the body re-runs it. Drafts, bots' PRs and PRs labelled
# `skip-pr-check` pass unchecked; marking a draft ready runs it. Ubuntu
# only: no macOS minutes.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  complete:
    name: Post PR complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A fork's PR gets a read-only token that can't set a status: there
      # the job's own result is the verdict, as before.
      - run: node scripts/check-pr-complete.ts "$PR_NUMBER" $STATUS_FLAG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS_FLAG: ${{ github.event.pull_request.head.repo.full_name == github.repository && '--status' || '' }}
