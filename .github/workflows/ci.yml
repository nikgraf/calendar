name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual reruns of the testing build (Actions → CI → Run workflow).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR pushes supersede each other; main pushes must all complete — a
  # cancelled testing-build ships no artifact, and a cancelled EAS
  # publish silently strands testers on old JS.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Desktop e2e (Electron, CDP)
    # macos-15: macos-14 images are deprecated; e2e needs no macOS 26 SDK
    # (the helper is availability-guarded and e2e never invokes the model).
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calendar/desktop build
      # `require('electron')` downloads the binary lazily when dist/ is
      # missing; two spec files doing that at once raced into a broken
      # install. Fetch it once, up front.
      - run: pnpm --filter @calendar/desktop exec electron --version
      - run: pnpm test:e2e
      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_attempt }}
          path: |
            apps/desktop/e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # Real EventKit on the desktop: the Swift helper against the runner's own
  # Reminders database. The per-user TCC grant is seeded by script (not an
  # Apple-supported interface — see the script header), then a probe
  # requires the helper to answer fullAccess before the suite runs; if a
  # new runner image breaks the seed the job goes red rather than green
  # while testing nothing. macos-26: build:helper needs the macOS 26 SDK.
  e2e-reminders:
    name: Desktop e2e (real Reminders via helper)
    needs: gate
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calendar/desktop build:helper
      - run: pnpm --filter @calendar/desktop build
      - run: pnpm --filter @calendar/desktop exec electron --version
      - name: Pre-grant Reminders to the helper (TCC)
        run: bash apps/desktop/e2e/ci/grant-reminders-tcc.sh apps/desktop/helper/.build/release/solunivo-model-helper
      - name: Probe helper access
        run: bash apps/desktop/e2e/ci/probe-helper-access.sh apps/desktop/helper/.build/release/solunivo-model-helper
      - run: E2E=1 CALENDAR_E2E_REMINDERS=real pnpm exec vp test run apps/desktop/e2e/remindersReal.e2e.ts
      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reminders-diagnostics-${{ github.run_attempt }}
          path: |
            apps/desktop/e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # Real EventKit on iOS: Maestro drives the dev client on a simulator whose
  # Reminders grant is pre-seeded (simctl privacy, supported). CI never
  # compiles the app: the dev client is the EAS development-simulator
  # build for this commit's native fingerprint, kept in the Actions cache
  # so a JS-only push downloads nothing (a new fingerprint fetches, or
  # first requests, one EAS build). Metro on the runner serves the JS.
  ios-e2e:
    name: iOS e2e (Maestro, real Reminders)
    needs: gate
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set — the dev client comes from EAS"
            exit 1
          fi
      - id: fingerprint
        name: Native fingerprint
        working-directory: apps/ios
        run: |
          HASH=$(npx expo-updates fingerprint:generate --platform ios | jq -r '.hash // empty')
          test -n "$HASH" || { echo "::error::fingerprint generation failed"; exit 1; }
          echo "fingerprint: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
      - id: devclient
        name: Restore the dev client for this fingerprint
        uses: actions/cache@v4
        with:
          path: apps/ios/build/devclient
          # No restore-keys: a build for another fingerprint is never valid.
          key: ios-devclient-${{ steps.fingerprint.outputs.hash }}
      - name: Fetch the dev client from EAS
        if: steps.devclient.outputs.cache-hit != 'true'
        working-directory: apps/ios
        run: bash e2e/ci/fetch-dev-client.sh "${{ steps.fingerprint.outputs.hash }}"
      - name: Boot a simulator, install, pre-grant Reminders
        run: bash apps/ios/e2e/ci/prepare-simulator.sh apps/ios/build/devclient/Solunivo.app
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Pin the runtime version for Metro
        # After the fingerprint step (an explicit runtimeVersion would change
        # the fingerprint): with the fingerprint policy Expo CLI re-runs a
        # full project fingerprint for every manifest request, which on this
        # runner outlasts the dev launcher's 10 s request timeout.
        working-directory: apps/ios
        run: cp e2e/ci/app.config.ci.js app.config.js
      - name: Start Metro
        working-directory: apps/ios
        env:
          EXPO_RUNTIME_VERSION_PIN: ${{ steps.fingerprint.outputs.hash }}
        run: |
          nohup pnpm exec expo start --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8081/status >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/status
          # Warm the bundle before the dev client asks for it: a cold first
          # bundle on a small runner outlasts the dev client's request
          # timeout ("Failed to load app … The request timed out"). The
          # manifest names the exact bundle URL (transform options
          # included), so this request and the client's share Metro's cache.
          BUNDLE_URL=$(curl -fsS -H 'expo-platform: ios' http://127.0.0.1:8081/ | jq -r '.launchAsset.url')
          echo "warming $BUNDLE_URL"
          time curl -fsS -o /dev/null --max-time 900 "$BUNDLE_URL"
          grep -a "Bundled" "$RUNNER_TEMP/metro.log" | tail -1
      - name: Simulator ↔ Metro diagnostics
        # Independent of the app: what Metro listens on, and whether Safari
        # inside the simulator can load Metro's status page at all (the
        # screenshot lands in the failure artifact).
        run: |
          lsof -nP -iTCP:8081 -sTCP:LISTEN || true
          xcrun simctl openurl "$SIMULATOR_UDID" "http://127.0.0.1:8081/status"
          sleep 10
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/safari-metro-status.png"
      - name: Open the dev client on Metro
        # The launcher screen otherwise waits for a server choice; the first
        # bundle takes a while, which the flows' 60 s "Today" wait covers.
        run: xcrun simctl openurl "$SIMULATOR_UDID" "solunivo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
      # Two invocations: Maestro runs a directory's flows in a
      # non-deterministic order (config.yaml executionOrder is not
      # honored — mobile-dev-inc/maestro#2231), and the bootstrap must
      # come first. Every other flow is independent of the ones before it.
      - name: Bootstrap the dev client onto Metro
        working-directory: apps/ios
        run: maestro test --device "$SIMULATOR_UDID" e2e/flows/00-devclient-bootstrap.yaml
      - name: Maestro flows
        working-directory: apps/ios
        run: maestro test --include-tags ci --exclude-tags ci-bootstrap --device "$SIMULATOR_UDID" e2e/flows
      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-diagnostics-${{ github.run_attempt }}
          path: |
            ~/.maestro/tests/
            ${{ runner.temp }}/metro.log
            ${{ runner.temp }}/*.png
          retention-days: 7
          if-no-files-found: ignore

  # PR-only unsigned packaging smoke: Forge packaging broke twice with
  # failures only a real package run reveals (a retired native module's
  # ENOENT in #36, a dangling .bin symlink in the copy hook) — and both
  # surfaced post-merge because PRs never packaged. Signing is env-gated,
  # so with no APPLE_* env this needs no secrets. macos-26: build:helper
  # needs the macOS 26 SDK (same as testing-build).
  package-smoke:
    name: Packaging smoke (unsigned .app)
    if: github.event_name == 'pull_request'
    needs: gate
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calendar/desktop package:app
      - name: Verify packaged contents
        run: |
          APP="apps/desktop/out/Solunivo-darwin-arm64/Solunivo.app"
          test -d "$APP" || { echo "::error::packaged app missing"; exit 1; }
          test -x "$APP/Contents/Resources/solunivo-model-helper" \
            || { echo "::error::model helper missing from Resources"; exit 1; }
          # Regression check for the ignore-list fix: never ship Swift build
          # objects, e2e source, or local e2e screenshots inside the app.
          for banned in helper e2e e2e-artifacts; do
            if [ -e "$APP/Contents/Resources/app/$banned" ]; then
              echo "::error::packaged app contains $banned/ — forge ignore list regressed"
              exit 1
            fi
          done

  # Signed + notarized arm64 zip on every push to main, downloadable as an
  # Actions artifact for team-internal testing. Secret setup and tester
  # instructions: docs/distribution.md. Not gated on e2e — merge protection
  # already required it on the PR.
  testing-build:
    name: macOS testing build (signed + notarized)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: gate
    # macos-26: the Swift model helper needs the macOS 26 SDK
    # (FoundationModels/SpeechAnalyzer). Runtime stays guarded, so the
    # packaged app still runs on older macOS with the model unavailable.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Forge silently degrades to an unsigned build when the APPLE_* env is
      # missing — fail loudly instead of shipping a misleading artifact.
      - name: Ensure signing secrets are configured
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_ID APPLE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
                      MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret ${name} is not set (see docs/distribution.md)"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
      - run: pnpm install --frozen-lockfile
      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # make = vp build + tsdown + electron-forge make: packages, signs,
      # notarizes + staples (packager runs @electron/notarize), then zips.
      - name: Build, sign, notarize, zip
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_VERSION: ${{ env.SHORT_SHA }}
        run: pnpm --filter @calendar/desktop make
      - name: Verify signature, notarization, staple
        run: |
          APP="apps/desktop/out/Solunivo-darwin-arm64/Solunivo.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute -vv "$APP"
          xcrun stapler validate "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: Solunivo-testing-${{ env.SHORT_SHA }}
          path: apps/desktop/out/make/zip/darwin/arm64/*.zip
          retention-days: 14
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
