name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual reruns of the testing build (Actions → CI → Run workflow).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR pushes supersede each other; main pushes must all complete — a
  # cancelled testing-build ships no artifact, and a cancelled EAS
  # publish silently strands testers on old JS.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Docs-only pushes used to run every macOS job — up to ~125 wall minutes
  # per push at the private-repo multiplier (the spending limit was hit on
  # 2026-09-05). Classify the change once; the macOS jobs run only when
  # code changed. A job skipped by `if:` still reports (as skipped, which
  # branch protection accepts) — `paths-ignore` on the workflow would make
  # a required check never report at all. Anything unclassifiable counts
  # as code for both platforms.
  #
  # Code is split by platform too: a change only under apps/ios/ cannot
  # affect the desktop jobs, and one only under apps/desktop/ or
  # packages/agent/ (desktop-only, see CLAUDE.md) cannot affect iOS — a
  # desktop-only PR ran the ~40-minute iOS e2e anyway. Everything else
  # (the shared packages, root config, the lockfile, workflows, brand/)
  # runs both. apps/ios/assets/ holds brand exports that packaging smoke
  # checks (brand:check), so it counts for the desktop jobs as well.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.classify.outputs.desktop }}
      ios: ${{ steps.classify.outputs.ios }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          files=""
          case "${{ github.event_name }}" in
            pull_request)
              files=$(gh api --paginate "repos/$REPO/pulls/${{ github.event.number }}/files"                 --jq '.[].filename') || files=""
              ;;
            push)
              before="${{ github.event.before }}"
              if [ "$before" != "0000000000000000000000000000000000000000" ]; then
                files=$(gh api "repos/$REPO/compare/${before}...${{ github.sha }}"                   --jq '.files[].filename') || files=""
              fi
              ;;
          esac
          if [ -z "$files" ]; then
            echo "could not classify the change — treating it as code for both platforms"
            { echo "desktop=true"; echo "ios=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          # Docs-only: every path is Markdown or lives under docs/. grep
          # finds no line then and exits 1, which `bash -e` (how Actions
          # runs this step) would treat as a failure.
          code=$(echo "$files" | grep -vE '^(docs/.*|([^/]+/)*[^/]+\.md)$' || true)
          desktop=false
          ios=false
          if [ -n "$code" ]; then
            if echo "$code" | grep -vE '^apps/ios/' | grep -q . ||
              echo "$code" | grep -qE '^apps/ios/assets/'; then
              desktop=true
            fi
            if echo "$code" | grep -vE '^(apps/desktop/|packages/agent/)' | grep -q .; then
              ios=true
            fi
          fi
          echo "desktop jobs: $desktop, iOS jobs: $ios"
          { echo "desktop=$desktop"; echo "ios=$ios"; } >> "$GITHUB_OUTPUT"

  # The gate lives in gate.yml so ios.yml can run the same one (see the
  # note there about the check name).
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml

  e2e:
    name: Desktop e2e (Electron, CDP)
    # After the gate, like the other macOS jobs: a red gate used to leave
    # this one burning macOS minutes on a change that cannot merge.
    needs: [gate, changes]
    if: needs.changes.outputs.desktop == 'true'
    # macos-15: macos-14 images are deprecated; e2e needs no macOS 26 SDK
    # (the helper is availability-guarded and e2e never invokes the model).
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calendar/desktop build
      # `require('electron')` downloads the binary lazily when dist/ is
      # missing; two spec files doing that at once raced into a broken
      # install. Fetch it once, up front.
      - run: pnpm --filter @calendar/desktop exec electron --version
      - run: pnpm test:e2e
      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.run_attempt }}
          path: |
            apps/desktop/e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # Real EventKit on the desktop: the Swift helper against the runner's own
  # Reminders database. The per-user TCC grant is seeded by script (not an
  # Apple-supported interface — see the script header), then a probe
  # requires the helper to answer fullAccess before the suite runs; if a
  # new runner image breaks the seed the job goes red rather than green
  # while testing nothing. macos-26: build:helper needs the macOS 26 SDK.
  e2e-reminders:
    name: Desktop e2e (real Reminders and Calendar via helper)
    needs: [gate, changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache the Electron binary
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache the Swift helper build
        uses: actions/cache@v6
        with:
          path: apps/desktop/helper/.build
          key: helper-${{ runner.os }}-${{ hashFiles('apps/desktop/helper/Package.swift', 'apps/desktop/helper/Package.resolved', 'apps/desktop/helper/Sources/**', 'packages/ai/swift/**', 'packages/apple-calendar/swift/**', 'packages/contacts/swift/**', 'packages/geo/swift/**', 'packages/reminders/swift/**') }}
          restore-keys: helper-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calendar/desktop build:helper
      - run: pnpm --filter @calendar/desktop build
      - run: pnpm --filter @calendar/desktop exec electron --version
      - name: Pre-grant Reminders to the helper (TCC)
        run: bash apps/desktop/e2e/ci/grant-reminders-tcc.sh apps/desktop/helper/.build/release/solunivo-model-helper
      - name: Pre-grant Calendars to the helper (TCC)
        run: bash apps/desktop/e2e/ci/grant-reminders-tcc.sh apps/desktop/helper/.build/release/solunivo-model-helper kTCCServiceCalendar
      - name: Probe helper access
        run: |
          bash apps/desktop/e2e/ci/probe-helper-access.sh apps/desktop/helper/.build/release/solunivo-model-helper reminders
          bash apps/desktop/e2e/ci/probe-helper-access.sh apps/desktop/helper/.build/release/solunivo-model-helper calendar
      - run: E2E=1 CALENDAR_E2E_REMINDERS=real pnpm exec vp test run apps/desktop/e2e/remindersReal.e2e.ts
      - run: E2E=1 CALENDAR_E2E_APPLE_CALENDAR=real pnpm exec vp test run apps/desktop/e2e/appleCalendarReal.e2e.ts
      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reminders-diagnostics-${{ github.run_attempt }}
          path: |
            apps/desktop/e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # Real EventKit on iOS: Maestro drives the app on a simulator whose
  # Reminders grant is pre-seeded (simctl privacy, supported). CI never
  # compiles the app: the native half is the EAS `e2e-simulator` build (the
  # dev variant in Release configuration) for this commit's native
  # fingerprint, kept in the Actions cache so a JS-only push downloads
  # nothing (a new fingerprint fetches, or first requests, one EAS build).
  # The JS half is bundled here and embedded into that app
  # (repack-app.sh), so there is no Metro and no dev launcher: a launch
  # takes seconds instead of the ~30 s a dev client needs to re-download
  # its bundle. Two shards, each on its own runner and simulator; the flows
  # do not depend on each other (shard-flows.mjs splits them).
  ios-e2e-shards:
    name: iOS e2e shard ${{ matrix.shard }}/2
    needs: [gate, changes]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    # A green shard takes 25–34 min, about half of it setup. At 35 a slow
    # runner was cancelled two flows short of passing (run 37336020673),
    # throwing the whole run away; the cap is for hung jobs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      # The dev variant (apps/ios/app.config.js): the fingerprint, the EAS
      # build it selects and the embedded bundle must all be computed for
      # the same variant.
      APP_VARIANT: development
      # Pinned + checksum-verified below; bump both together.
      MAESTRO_VERSION: 2.10.0
      MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
    steps:
      - uses: actions/checkout@v7
      # First, in the background: a runner's first boot spends about two
      # minutes in data migration, which now overlaps the install and the
      # bundling below.
      - name: Start booting a simulator
        run: bash apps/ios/e2e/ci/prepare-simulator.sh boot
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set — the app's native build comes from EAS"
            exit 1
          fi
      - id: fingerprint
        name: Native fingerprint
        working-directory: apps/ios
        run: |
          HASH=$(npx expo-updates fingerprint:generate --platform ios | jq -r '.hash // empty')
          test -n "$HASH" || { echo "::error::fingerprint generation failed"; exit 1; }
          echo "fingerprint: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
      - id: app
        name: Restore the e2e build for this fingerprint
        uses: actions/cache@v6
        with:
          path: apps/ios/build/e2e-app
          # No restore-keys: a build for another fingerprint is never valid.
          # Its own prefix: the dev client (google-live.yml) has the same
          # fingerprint and is a different build.
          key: ios-e2e-app-${{ steps.fingerprint.outputs.hash }}
      - name: Fetch the e2e build from EAS
        if: steps.app.outputs.cache-hit != 'true'
        # The only step that needs the token. Both shards miss the cache on
        # a new fingerprint; only the first may request the build.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/ios
        run: >-
          bash e2e/ci/fetch-eas-build.sh "${{ steps.fingerprint.outputs.hash }}"
          e2e-simulator build/e2e-app ${{ matrix.shard != 1 && '--wait-only' || '' }}
      - name: Embed this commit's JS
        working-directory: apps/ios
        env:
          # The in-process fake Google API with a signed-in fixture account,
          # so the Google halves of the flows (create event, task lane, task
          # convert) run without a real account. Inlined at bundle time.
          EXPO_PUBLIC_CALENDAR_GOOGLE: fixture
          # The deterministic model and text recognizer from @calendar/ai:
          # quick-add (06) and capture (22) assert real outcomes instead of
          # whatever the runner's Apple Intelligence allows.
          EXPO_PUBLIC_CALENDAR_MODEL: fixture
        run: bash e2e/ci/repack-app.sh build/e2e-app/Solunivo.app build/e2e-repacked/Solunivo.app
      - name: Install on the simulator, pre-grant Reminders
        run: bash apps/ios/e2e/ci/prepare-simulator.sh install apps/ios/build/e2e-repacked/Solunivo.app
      - name: Cache Maestro
        id: maestro
        uses: actions/cache@v6
        with:
          # The install only: ~/.maestro/tests holds run reports, and the
          # live suite's reports carry its access token (google-live.yml).
          path: |
            ~/.maestro/bin
            ~/.maestro/lib
          key: maestro-install-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro (pinned release, checksum verified)
        # The same layout the official installer produces (lib/ + bin/ under
        # ~/.maestro), without piping a remote script into bash.
        if: steps.maestro.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/maestro.zip"
          curl -fsSL -o "$zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $zip" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/maestro-unzip" "$HOME/.maestro"
          unzip -qo "$zip" -d "$RUNNER_TEMP/maestro-unzip"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-unzip/maestro/." "$HOME/.maestro/"
      - run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # A separate invocation, on one shard only: the permission prompts
      # must come before any Apple account is connected, and Maestro runs
      # a set of flows in a non-deterministic order (config.yaml
      # executionOrder is not honored — mobile-dev-inc/maestro#2231). The
      # remaining flows do not depend on ordering.
      - name: First-time device permissions
        if: matrix.shard == 1
        working-directory: apps/ios
        run: maestro test --device "$SIMULATOR_UDID" e2e/flows/04a-device-permissions.yaml
      - name: Maestro flows
        working-directory: apps/ios
        run: |
          set -euo pipefail
          flows=$(node e2e/ci/shard-flows.mjs "${{ matrix.shard }}" 2)
          echo "$flows"
          # shellcheck disable=SC2086
          maestro test --device "$SIMULATOR_UDID" $flows
      - name: Wait for a simulator crash report
        # ReportCrash writes the .ips a minute or so after the process
        # dies (74 s on run 34013939965); the upload step ran before it
        # existed. Wait for one, and put its exception + crashed thread in
        # the job log so the artifact is not the only place to look.
        if: failure()
        run: |
          for _ in $(seq 1 24); do
            ls ~/Library/Logs/DiagnosticReports/Solunivo*.ips >/dev/null 2>&1 && break
            sleep 5
          done
          for f in ~/Library/Logs/DiagnosticReports/Solunivo*.ips; do
            [ -e "$f" ] || { echo "no Solunivo crash report"; break; }
            echo "== $f"
            # Header line is JSON, then the report body (JSON): show the
            # exception, termination and the faulting thread's frames.
            tail -n +2 "$f" | jq -r '
              "exception: \(.exception // {} | tostring)",
              "termination: \(.termination // {} | tostring)",
              (.threads[.faultingThread // 0] // {} | .frames // [] | .[0:25][]
                | "  \(.imageIndex) \(.symbol // "?") + \(.imageOffset // 0)"),
              "images:", (.usedImages // [] | to_entries[] | "  \(.key) \(.value.name // "?")")
            ' 2>/dev/null || head -c 4000 "$f"
          done
      - name: Upload Maestro diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-diagnostics-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ~/.maestro/tests/
            ~/Library/Logs/DiagnosticReports/Solunivo*.ips
          retention-days: 7
          if-no-files-found: ignore

  # The check branch protection requires, under the name the single job
  # had before it was sharded. Skipped shards (a docs-only or desktop-only
  # change) pass, as a skipped job did.
  ios-e2e:
    name: iOS e2e (Maestro, real Reminders)
    needs: [ios-e2e-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.ios-e2e-shards.result }}
        run: |
          echo "shards: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]

  # PR-only unsigned packaging smoke: Forge packaging broke twice with
  # failures only a real package run reveals (a retired native module's
  # ENOENT in #36, a dangling .bin symlink in the copy hook) — and both
  # surfaced post-merge because PRs never packaged. Signing is env-gated,
  # so with no APPLE_* env this needs no secrets. macos-26: build:helper
  # needs the macOS 26 SDK (same as testing-build).
  package-smoke:
    name: Packaging smoke (unsigned .app)
    needs: [gate, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.desktop == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache the Swift helper build
        uses: actions/cache@v6
        with:
          path: apps/desktop/helper/.build
          key: helper-${{ runner.os }}-${{ hashFiles('apps/desktop/helper/Package.swift', 'apps/desktop/helper/Package.resolved', 'apps/desktop/helper/Sources/**', 'packages/ai/swift/**', 'packages/apple-calendar/swift/**', 'packages/contacts/swift/**', 'packages/geo/swift/**', 'packages/reminders/swift/**') }}
          restore-keys: helper-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # The committed app icons and tokens.css are generated from brand/;
      # this is the only macOS job that runs whenever brand exports can
      # change (the classifier counts apps/ios/assets/ for the desktop jobs
      # too), and the generator needs iconutil. About a second.
      - name: Brand exports are up to date
        run: pnpm brand:check
      - run: pnpm --filter @calendar/desktop package:app
      - name: Verify packaged contents
        run: |
          APP="apps/desktop/out/Solunivo-darwin-arm64/Solunivo.app"
          test -d "$APP" || { echo "::error::packaged app missing"; exit 1; }
          test -x "$APP/Contents/Resources/solunivo-model-helper" \
            || { echo "::error::model helper missing from Resources"; exit 1; }
          # The agent relay: the wrapper must run the bundled script with
          # the app's own binary (ELECTRON_RUN_AS_NODE) and answer.
          "$APP/Contents/Resources/solunivo-cli" --version \
            || { echo "::error::solunivo-cli does not run from the packaged app"; exit 1; }
          # Regression check for the ignore-list fix: never ship Swift build
          # objects, e2e source, or local e2e screenshots inside the app.
          for banned in helper e2e e2e-artifacts resources; do
            if [ -e "$APP/Contents/Resources/app/$banned" ]; then
              echo "::error::packaged app contains $banned/ — forge ignore list regressed"
              exit 1
            fi
          done

  # Signed + notarized arm64 zip on every push to main, downloadable as an
  # Actions artifact for team-internal testing. Secret setup and tester
  # instructions: docs/distribution.md. Not gated on e2e — merge protection
  # already required it on the PR.
  testing-build:
    name: macOS testing build (signed + notarized)
    needs: [gate, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.desktop == 'true')
    # macos-26: the Swift model helper needs the macOS 26 SDK
    # (FoundationModels/SpeechAnalyzer). Runtime stays guarded, so the
    # packaged app still runs on older macOS with the model unavailable.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Forge silently degrades to an unsigned build when the APPLE_* env is
      # missing — fail loudly instead of shipping a misleading artifact.
      - name: Ensure signing secrets are configured
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_ID APPLE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
                      MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret ${name} is not set (see docs/distribution.md)"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Cache the Swift helper build
        uses: actions/cache@v6
        with:
          path: apps/desktop/helper/.build
          key: helper-${{ runner.os }}-${{ hashFiles('apps/desktop/helper/Package.swift', 'apps/desktop/helper/Package.resolved', 'apps/desktop/helper/Sources/**', 'packages/ai/swift/**', 'packages/apple-calendar/swift/**', 'packages/contacts/swift/**', 'packages/geo/swift/**', 'packages/reminders/swift/**') }}
          restore-keys: helper-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # Without this a downloaded testing build cannot sign in at all. The
      # desktop client secret is not confidential (RFC 8252); the file is
      # gitignored and read by loadOAuthConfig as its last source.
      - name: Embed the desktop OAuth client config (when the secrets exist)
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_DESKTOP_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_DESKTOP_CLIENT_ID is not set — the testing build cannot sign in"
            exit 0
          fi
          jq -n --arg id "$GOOGLE_DESKTOP_CLIENT_ID" --arg secret "$GOOGLE_DESKTOP_CLIENT_SECRET" \
            '{clientId: $id} + (if $secret == "" then {} else {clientSecret: $secret} end)' \
            > apps/desktop/google-oauth.json
      # make = vp build + vp pack + electron-forge make: packages, signs,
      # notarizes + staples (packager runs @electron/notarize), then zips.
      - name: Build, sign, notarize, zip
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_VERSION: ${{ env.SHORT_SHA }}
        run: pnpm --filter @calendar/desktop make
      - name: Stage the testing ZIP
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(apps/desktop/out/make/zip/darwin/arm64/*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one macOS ZIP, found ${#archives[@]}"
            exit 1
          fi
          cp "${archives[0]}" "$RUNNER_TEMP/Solunivo-testing-${SHORT_SHA}.zip"
      - name: Verify the app extracted from the testing ZIP
        run: |
          set -euo pipefail
          EXTRACT_DIR=$(mktemp -d "$RUNNER_TEMP/solunivo-verify.XXXXXX")
          ditto -x -k "$RUNNER_TEMP/Solunivo-testing-${SHORT_SHA}.zip" "$EXTRACT_DIR"
          APP="$EXTRACT_DIR/Solunivo.app"
          test -x "$APP/Contents/MacOS/solunivo" \
            || { echo "::error::extracted app executable missing or not executable"; exit 1; }
          test -x "$APP/Contents/Resources/solunivo-model-helper" \
            || { echo "::error::extracted model helper missing or not executable"; exit 1; }
          # Signed and under the hardened runtime: the relay still has to
          # start (it runs the app binary as Node; the RunAsNode fuse stays on).
          "$APP/Contents/Resources/solunivo-cli" --version \
            || { echo "::error::solunivo-cli does not run from the signed app"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          bash apps/desktop/scripts/check-privacy-entitlements.sh "$APP"
          spctl --assess --type execute -vv "$APP"
          xcrun stapler validate "$APP"
      # Direct uploads use the filename as the artifact name and avoid an
      # outer ZIP that Archive Utility would need to expand first.
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/Solunivo-testing-${{ env.SHORT_SHA }}.zip
          retention-days: 14
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
