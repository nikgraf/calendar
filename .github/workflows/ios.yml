name: iOS

# Publishing on main is fingerprint-gated: a push whose native fingerprint
# matches the latest TestFlight build ships as an OTA update (~30s); only a
# changed fingerprint (new pods, config plugins, SDK bumps) costs a full EAS
# build + TestFlight submit. PRs get an OTA preview on every push, and the
# `testflight` label forces a real build from a PR branch. Setup + tester
# flow: docs/distribution.md. Separate workflow file so `labeled` events
# don't re-trigger or cancel the main CI's gate/e2e.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secrets can't be read in a job-level `if`, so surface it as an output:
  # dependants then show as skipped rather than green-after-doing-nothing.
  preflight:
    name: Check publishing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_token: ${{ steps.token.outputs.present }}
    steps:
      - id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN is not set — iOS publishing jobs will skip"
          fi

  # Nothing publishes from code that fails the gate. ios.yml is a separate
  # workflow (so `labeled` events don't cancel CI), and `needs:` can't cross
  # workflows, so the checks run here too.
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  # Build only when necessary: with runtimeVersion.policy "fingerprint",
  # a build's runtime version IS the hash of everything native, so
  # comparing the pushed commit's fingerprint against the latest finished
  # main build answers "would an OTA update reach installed builds?".
  # Errors fail toward building — a wrong "build" wastes one build, a
  # wrong "skip" strands testers on a stale binary without any signal.
  decide:
    name: Decide build vs OTA update
    needs: [preflight, verify]
    if: >-
      needs.preflight.outputs.has_token == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: compare
        name: Compare fingerprint against the latest main build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/ios
        run: |
          NEEDS_BUILD=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs are the rebuild escape hatch — never skip them.
            echo "workflow_dispatch: building unconditionally"
          else
            LOCAL=$(npx expo-updates fingerprint:generate --platform ios | jq -r '.hash') || LOCAL=""
            LATEST=$(pnpm exec eas build:list --platform ios --status finished \
              --channel main --limit 1 --json --non-interactive \
              | jq -r '.[0].runtime.version // empty') || LATEST=""
            if [ -n "$LOCAL" ] && [ -n "$LATEST" ]; then
              echo "local fingerprint:  $LOCAL"
              echo "latest main build:  $LATEST"
              if [ "$LOCAL" = "$LATEST" ]; then
                NEEDS_BUILD=false
              fi
            else
              echo "::warning::Fingerprint comparison failed (local='$LOCAL', latest='$LATEST') — building to be safe"
            fi
          fi
          echo "needs_build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"

  # Waits for the cloud build so a failed build or submission fails CI —
  # --no-wait would go green the moment the build is queued.
  testflight:
    name: TestFlight build (EAS)
    needs: [preflight, verify, decide]
    if: >-
      needs.preflight.outputs.has_token == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.decide.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, then submit to TestFlight (on EAS infrastructure)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/ios
        run: |
          pnpm exec eas build --platform ios --profile testflight \
            --non-interactive --auto-submit \
            --message "main ${GITHUB_SHA::7}"

  # The fingerprint-unchanged path: installed TestFlight builds pick the
  # update up on next launch, the same mechanism as the PR previews.
  main-update:
    name: OTA update to main (EAS)
    needs: [preflight, verify, decide]
    if: >-
      needs.preflight.outputs.has_token == 'true' &&
      github.event_name == 'push' &&
      needs.decide.outputs.needs_build == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish OTA update to channel main
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/ios
        run: |
          pnpm exec eas update --branch main \
            --non-interactive --message "main ${GITHUB_SHA::7}"

  # JS-only preview: publishes the PR's bundle to OTA channel pr-<number>
  # (~30s). Load it on-device via Settings → PR preview. Skips quietly while
  # EXPO_TOKEN is absent so agent PRs aren't blocked before setup.
  preview-update:
    name: PR preview update (EAS)
    needs: [preflight, verify]
    if: >-
      needs.preflight.outputs.has_token == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish OTA update to channel pr-${{ github.event.number }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        working-directory: apps/ios
        run: |
          pnpm exec eas update --branch "pr-${{ github.event.number }}" \
            --non-interactive --message "$PR_TITLE @ ${HEAD_SHA:0:7}"
      - name: Upsert PR comment with the preview channel
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARKER="<!-- ios-preview -->"
          BODY="$MARKER
          📱 **iOS preview**: channel \`pr-${{ github.event.number }}\` @ ${HEAD_SHA:0:7} — on your phone: Settings → PR preview → enter the channel → Load. Native changes need a real build instead: add the \`testflight\` label."
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -f body="$BODY" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" -f body="$BODY" > /dev/null
          fi

  # Full TestFlight build from a PR branch, for PRs that change native code
  # (new pods, config plugins — anything the OTA fingerprint can't cover).
  # Trigger by adding the `testflight` label. The build ships on channel
  # `main`; switch to the PR's OTA channel in-app after installing.
  testflight-pr:
    name: TestFlight build for PR (label)
    needs: [preflight, verify]
    if: >-
      needs.preflight.outputs.has_token == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'testflight'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, then submit to TestFlight (on EAS infrastructure)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: apps/ios
        run: |
          pnpm exec eas build --platform ios --profile testflight \
            --non-interactive --auto-submit \
            --message "PR #${{ github.event.number }} ${GITHUB_SHA::7}"
