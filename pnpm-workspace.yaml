packages:
  - packages/*
  - apps/*

nodeLinker: hoisted

# Supply-chain guards: newly published versions must be at least 2 days old
# before they resolve, package trust levels can't silently downgrade, and
# non-registry (git/url) subdeps are blocked for fresh resolutions —
# lockfile-pinned entries (@electron/node-gyp's git tarball) stay allowed.
minimumReleaseAge: 2880 # 2 days
trustPolicy: no-downgrade
# Legacy transitive pins that predate their packages' provenance — they
# register as trust downgrades without being ones. Audit when bumped.
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0
  - '@octokit/endpoint@9.0.6'
  - effect@4.0.0-beta.93
  - '@effect/atom-react@4.0.0-beta.93'
  - '@effect/platform-node@4.0.0-beta.93'
  - '@effect/sql-sqlite-node@4.0.0-beta.93'
  - '@effect/sql-sqlite-react-native@4.0.0-beta.93'
  - '@effect/vitest@4.0.0-beta.93'
blockExoticSubdeps: true

catalog:
  effect: 4.0.0-beta.93
  '@effect/atom-react': 4.0.0-beta.93
  '@effect/platform-node': 4.0.0-beta.93
  '@effect/sql-sqlite-node': 4.0.0-beta.93
  '@effect/sql-sqlite-react-native': 4.0.0-beta.93
  '@effect/vitest': 4.0.0-beta.93
  '@js-temporal/polyfill': ^0.5.1
  react: ^19.2.7
  react-dom: ^19.2.7
  rrule-temporal: ^1.6.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.2
  vite-plus: ^0.2.2
  vitest: 4.1.9

onlyBuiltDependencies:
  - '@swc/core'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - electron
  - unrs-resolver

overrides:
  # yauzl 2.x silently kills the process under modern Node during
  # electron-packager's zip extraction (same fix as codiff).
  'extract-zip>yauzl': ^3.4.0
  vite: 'catalog:'
  vitest: 'catalog:'

minimumReleaseAgeExclude:
  - '@effect/atom-react@4.0.0-beta.93'
  - '@effect/sql-sqlite-node@4.0.0-beta.93'
  - '@effect/vitest@4.0.0-beta.93'
  - '@voidzero-dev/vite-plus-core@0.2.2'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.2.2'
  - '@voidzero-dev/vite-plus-darwin-x64@0.2.2'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.2'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.2.2'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.2.2'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.2.2'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.2'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.2.2'
  - effect@4.0.0-beta.93
  - rrule-temporal@1.6.0
  - vite-plus@0.2.2
  - '@effect/sql-sqlite-react-native@4.0.0-beta.93'

allowBuilds:
  better-sqlite3: true
  msgpackr-extract: false
