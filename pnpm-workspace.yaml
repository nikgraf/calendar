packages:
  - packages/*
  - apps/*

nodeLinker: hoisted

# Supply-chain guards: newly published versions must be at least 2 days old
# before they resolve, package trust levels can't silently downgrade, and
# non-registry (git/url) subdeps are blocked for fresh resolutions.
minimumReleaseAge: 2880 # 2 days
trustPolicy: no-downgrade
# Legacy transitive pins that predate their packages' provenance — they
# register as trust downgrades without being ones. Audit when bumped.
trustPolicyExclude:
  - semver@6.3.1
  - '@octokit/endpoint@9.0.6'
blockExoticSubdeps: true

catalog:
  effect: 4.1.0
  '@effect/atom-react': 4.1.0
  '@effect/sql-sqlite-node': 4.1.0
  '@effect/sql-sqlite-react-native': 4.1.0
  '@effect/vitest': 4.1.0
  '@js-temporal/polyfill': ^0.5.1
  # react and react-dom are pinned exactly, for both apps, to the React
  # Native renderer's version: React Native 0.88 renders with 19.3.0 and
  # Expo SDK 58 expects it (`npx expo install --check`). react-dom throws
  # unless it equals react, and a tilde could resolve the two to different
  # patches; a caret once let the lockfile resolve past the renderer (#144).
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ~19.3.0
  rrule-temporal: ^2.2.8
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5

onlyBuiltDependencies:
  - '@swc/core'
  - '@tailwindcss/oxide'
  - electron
  - unrs-resolver

overrides:
  # The react-dom pnpm installs for Expo's optional web peer
  # (@expo/metro-runtime) would otherwise be the newest, past the 19.3 hold.
  react-dom: 'catalog:'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

allowBuilds:
  # Optional native tracing inside eas-cli; the JS stub fallback is fine.
  dtrace-provider: false
  msgpackr-extract: false
  # Pulled in by eas-cli; its postinstall only prints a notice.
  protobufjs: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
