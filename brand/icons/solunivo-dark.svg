<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="solunivo-dark-24-title solunivo-dark-24-description">
  <title id="solunivo-dark-24-title">Solunivo — proposed dark appearance</title>
  <desc id="solunivo-dark-24-description">Same 24 compact-curl geometry with a plum face, soft ivory numerals, mint fold and muted blush backing. Proposed dark appearance, pending visual approval.</desc>
