<svg xmlns="http://www.w3.org/2000/svg" width="288" height="268" viewBox="0 0 288 268" fill="none" role="img" aria-label="Solunivo stacked logo for dark backgrounds"><title>Solunivo stacked logo for dark backgrounds</title><svg xmlns="http://www.w3.org/2000/svg" width="196" height="196" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="solunivo-number-24-title solunivo-number-24-description" x="46" y="0">
  <title id="solunivo-number-24-title">Solunivo — 24 / Inter Bold</title>
