appId: com.solunivo.app.dev
name: Select the picker row named NAME (shared) — calendar or task list
---
# A row reads "<name>" and carries the radio's selected state once chosen
# (a CheckRow: the check mark is a glyph, not text — the label lost its
# ", ✓" in #223). Maestro counts a row clipped at the sheet's scroll edge
# as visible and its tap then lands on nothing (run 35998271822: the task
# went to the default list), so the row is scrolled to the middle first
# and the tap repeats until the selected state proves the selection took.
- repeat:
    times: 3
    while:
      notVisible:
        text: '${NAME}'
        selected: true
    commands:
      - scrollUntilVisible:
          element:
            text: '${NAME}'
          direction: DOWN
          centerElement: true
      - tapOn: '${NAME}'
- assertVisible:
    text: '${NAME}'
    selected: true
