appId: com.solunivo.app.dev
name: Open the event whose block matches BLOCK in the edit sheet (shared)
---
# The day grid scrolls, and Maestro counts a block outside its viewport as
# visible — the tap then lands on nothing (flow 05, first CI runs). Centre
# the block first and repeat until the sheet is up.
- repeat:
    times: 3
    while:
      notVisible:
        id: 'event-edit'
    commands:
      - scrollUntilVisible:
          element:
            text: ${BLOCK}
          direction: DOWN
          centerElement: true
      - tapOn: ${BLOCK}
      - extendedWaitUntil:
          visible:
            id: 'event-edit'
          timeout: 5000
          optional: true
# The detail sheet is up; Edit opens the editor.
- runFlow: ../common/open-event-editor.yaml
