appId: com.solunivo.app.dev
name: One 412 round (shared) — edit the block to MINE while Google renames it to THEIRS, settle with CHOICE → output.mine, output.theirs
---
# The sheet is filled first and Google patched just before Save, so the
# window in which the app's own poll could refresh the etag (and defuse
# the conflict) is the few seconds the Save tap takes. If a poll still
# wins the race the edit simply lands and no banner shows — then the round
# is repeated with fresh titles (MINE-r2, THEIRS-r2, …): the same ones
# again would make the app's save a no-op (no op, no 412) and leave
# Google's etag as it was (run 40265233306 lost all three attempts that
# way). output.mine and output.theirs hold the titles the round settled.
- evalScript: ${output.banner = false}
- evalScript: ${output.attempt = 0}
- repeat:
    times: 3
    while:
      true: ${!output.banner}
    commands:
      - evalScript: ${output.attempt = output.attempt + 1}
      - evalScript: "${output.mine = output.attempt === 1 ? MINE : MINE + '-r' + output.attempt}"
      - evalScript: "${output.theirs = output.attempt === 1 ? THEIRS : THEIRS + '-r' + output.attempt}"
      - runFlow:
          file: open-event.yaml
          env:
            BLOCK: ${BLOCK}
      - tapOn:
          id: 'event-title'
      - tapOn: 'Clear text'
      - inputText: ${output.mine}
      - runScript:
          file: scripts/patchEvent.js
          env:
            EVENT_ID: ${EVENT_ID}
            SUMMARY: ${output.theirs}
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'Edit Event'
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: 'conflict-banner'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'conflict-banner'
          commands:
            - evalScript: ${output.banner = true}
- assertVisible:
    id: 'conflict-banner'
# The banner opens a native alert: Later, then the two versions.
- tapOn:
    id: 'conflict-banner'
- tapOn: ${CHOICE}
- extendedWaitUntil:
    notVisible:
      id: 'conflict-banner'
    timeout: 30000
