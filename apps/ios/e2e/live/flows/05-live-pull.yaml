appId: com.solunivo.app
name: Live Google — an event another device adds shows up through the poll
tags:
  - live
---
- runFlow: ../../common/launch.yaml
# Next whole hour plus one: near where the day view sits after launch.
- runScript:
    file: ../scripts/insertEvent.js
    env:
      HOURS_AHEAD: '1'
      TITLE: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-pulled'
# Metro runs with a 30 s poll in the live job; three ticks is plenty.
- extendedWaitUntil:
    visible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-pulled.*'
    timeout: 100000

# Clean up.
- tapOn: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-pulled.*'
- assertVisible: 'Edit Event'
- tapOn:
    id: 'event-delete'
- extendedWaitUntil:
    notVisible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-pulled.*'
    timeout: 20000
