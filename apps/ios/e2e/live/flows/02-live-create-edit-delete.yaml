appId: com.solunivo.app
name: Live Google — create, rename, make all-day and delete an event; Google follows each step
tags:
  - live
---
- runFlow: ../../common/launch.yaml
- runFlow: ../../common/open-new-event.yaml
# Into the run's calendar, never the account's first writable one.
- scrollUntilVisible:
    element:
      text: ${MAESTRO_LIVE_CALENDAR_NAME}
    direction: DOWN
- tapOn: ${MAESTRO_LIVE_CALENDAR_NAME}
- scrollUntilVisible:
    element:
      id: 'event-title'
    direction: UP
- tapOn:
    id: 'event-title'
# ASCII only: unicode through XCTest typing is a known flaky spot.
- inputText: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-event'
- tapOn:
    id: 'event-save'
- extendedWaitUntil:
    notVisible: 'New Event'
    timeout: 20000
# A timed block's label is title plus time range: match the title as a prefix.
- extendedWaitUntil:
    visible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-event.*'
    timeout: 10000

# Landed on Google, with an etag.
- runFlow:
    file: ../wait-for-event.yaml
    env:
      TITLE: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-event'
- assertTrue:
    condition: ${typeof output.event.etag === 'string' && output.event.etag.length > 0}
    label: 'the created event carries an etag'
- evalScript: ${output.eventId = output.event.id}

# Rename through the sheet.
- tapOn: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-event.*'
- assertVisible: 'Edit Event'
- tapOn:
    id: 'event-title'
- eraseText: 100
- inputText: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-edited'
- tapOn:
    id: 'event-save'
- extendedWaitUntil:
    notVisible: 'Edit Event'
    timeout: 20000
- extendedWaitUntil:
    visible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-edited.*'
    timeout: 10000
- runFlow:
    file: ../wait-for-event-state.yaml
    env:
      EVENT_ID: ${output.eventId}
      EXPECT: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-edited'

# Change its shape: the all-day switch turns start/end into dates on Google.
- tapOn: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-edited.*'
- assertVisible: 'Edit Event'
- tapOn:
    id: 'event-all-day'
- tapOn:
    id: 'event-save'
- extendedWaitUntil:
    notVisible: 'Edit Event'
    timeout: 20000
# Now an all-day chip: its label is the bare title.
- extendedWaitUntil:
    visible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-edited'
    timeout: 10000
- runFlow:
    file: ../wait-for-event-state.yaml
    env:
      EVENT_ID: ${output.eventId}
      EXPECT: 'allday'

# Delete from the sheet; Google answers cancelled (or 404/410).
- tapOn: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-edited'
- assertVisible: 'Edit Event'
- tapOn:
    id: 'event-delete'
- extendedWaitUntil:
    notVisible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-edited'
    timeout: 20000
- runFlow:
    file: ../wait-for-event-state.yaml
    env:
      EVENT_ID: ${output.eventId}
      EXPECT: 'gone'
