appId: com.solunivo.app.dev
name: Live Google — a task in the run's list gets Google's id, completes there, and a server-side reopen reaches the chip
tags:
  - live
---
- runFlow: ../../common/launch.yaml
- runFlow: ../../common/open-new-event.yaml
- runFlow: ../../common/switch-to-task.yaml
# Into the run's list (rows share id task-list-option; the title is unique).
- runFlow:
    file: ../pick-row.yaml
    env:
      NAME: ${MAESTRO_LIVE_LIST_NAME}
- scrollUntilVisible:
    element:
      id: 'task-title'
    direction: UP
- tapOn:
    id: 'task-title'
- inputText: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
- tapOn:
    id: 'event-save'
- extendedWaitUntil:
    notVisible: 'New Task'
    timeout: 20000
- extendedWaitUntil:
    visible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
    timeout: 10000

# The create pushed: Google has it (its id replaced the temp id by now).
- runFlow:
    file: ../wait-for-task.yaml
    env:
      TITLE: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
- evalScript: ${output.taskId = output.task.id}
- assertTrue:
    condition: ${output.task.status === 'needsAction'}
    label: 'a new task is open on Google'

# Check it off from the chip; Google completes it. The check's label
# names what a tap does, so a tap is proven by the label turning. A touch
# the app does not act on (run 40265233306's second one reached the
# window as a poll ended, and no op followed) fails here as such, rather
# than as a reopen the app never pulled; it is not tapped again, which
# would hide it.
- tapOn: 'Complete live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
- extendedWaitUntil:
    visible: 'Reopen live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
    timeout: 10000
- runFlow:
    file: ../wait-for-task.yaml
    env:
      STATUS: 'completed'
      TITLE: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-task'

# Another device reopens it; a poll brings that to the chip, which offers
# to complete it again. 30 s polls, and each re-reads the minute before
# its predecessor started, so three polls cover a page that missed it.
- runScript:
    file: ../scripts/patchTask.js
    env:
      STATUS: 'needsAction'
      TASK_ID: ${output.taskId}
- extendedWaitUntil:
    visible: 'Complete live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
    timeout: 100000
- tapOn: 'Complete live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
- extendedWaitUntil:
    visible: 'Reopen live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
    timeout: 10000
- runFlow:
    file: ../wait-for-task.yaml
    env:
      STATUS: 'completed'
      TITLE: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-task'

# Clean up through the sheet (the Delete button sits below the fold).
- tapOn: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
- assertVisible: 'Edit Task'
- scrollUntilVisible:
    element:
      id: 'task-delete'
    direction: DOWN
- tapOn:
    id: 'task-delete'
# The confirmation alert (deleteQuestion).
- tapOn: 'Delete'
- extendedWaitUntil:
    notVisible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-task'
    timeout: 20000
