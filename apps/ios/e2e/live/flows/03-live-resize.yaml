appId: com.solunivo.app
name: Live Google — dragging the block's bottom handle lengthens the event on Google (best effort)
tags:
  - live
---
# Maestro has no drag command and longPressOn releases after its press, so
# the block's long-press-then-pan move cannot be driven; the resize handle
# has no long press, so a slow swipe from the block's bottom edge should
# reach it. Unverified on the simulator: the final check is optional and
# reported as a warning, never a red run (mobile-dev-inc/maestro#1203).
- runFlow: ../../common/launch.yaml
- runFlow: ../../common/open-new-event.yaml
- scrollUntilVisible:
    element:
      text: ${MAESTRO_LIVE_CALENDAR_NAME}
    direction: DOWN
- tapOn: ${MAESTRO_LIVE_CALENDAR_NAME}
- scrollUntilVisible:
    element:
      id: 'event-title'
    direction: UP
- tapOn:
    id: 'event-title'
- inputText: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-resize'
- tapOn:
    id: 'event-save'
- extendedWaitUntil:
    notVisible: 'New Event'
    timeout: 20000
- extendedWaitUntil:
    visible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-resize.*'
    timeout: 10000
- runFlow:
    file: ../wait-for-event.yaml
    env:
      TITLE: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-resize'
- evalScript: ${output.eventId = output.event.id}
- evalScript: ${output.endBefore = output.event.end.dateTime}

# A slow downward swipe starting on the block's bottom edge.
- swipe:
    from:
      text: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-resize.*'
      point: '50%,92%'
    direction: DOWN
    duration: 1500
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../wait-for-event-state.yaml
    env:
      EVENT_ID: ${output.eventId}
      EXPECT: 'end-after'
      AFTER: ${output.endBefore}
    optional: true

# Clean up.
- tapOn: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-resize.*'
- assertVisible: 'Edit Event'
- tapOn:
    id: 'event-delete'
- extendedWaitUntil:
    notVisible: 'live-${MAESTRO_LIVE_RUN_TAG}-ios-resize.*'
    timeout: 20000
