appId: com.solunivo.app.dev
name: The Reminders form shows its extra fields and round-trips create, edits, a repeat rule and delete
tags:
  - ci
---
# Runs only when an Apple Reminders list is connected on the simulator
# (Settings › On This iPhone › Reminders › Connect, then allow the
# prompt). Without one the flow is a no-op, like flow 08 without a
# tasks-enabled account — except on CI (keyed on the fixture Google
# account, like 17), where the simulator's Reminders grant is pre-seeded
# (simctl privacy): it connects Reminders itself and undoes that at the
# end, and every write below goes through real EventKit and must
# succeed — the assertions are never skipped there.
- runFlow: ../common/launch.yaml
- tapOn: 'Today'
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: 'Day'
- runFlow: ../common/open-new-event.yaml
- runFlow: ../common/switch-to-task.yaml
- evalScript: ${output.connectedReminders = false}
- runFlow:
    when:
      visible: 'fixture@solunivo.test'
      notVisible:
        id: 'mode-reminder'
    commands:
      - evalScript: ${output.connectedReminders = true}
      - tapOn: 'Cancel'
      - runFlow: ../common/open-settings.yaml
      - runFlow:
          file: ../common/open-settings-page.yaml
          env:
            PAGE: device
      - tapOn:
          id: 'connect-reminders'
      # The Reminders row's subtitle carries this id only while the account exists.
      - extendedWaitUntil:
          visible:
            id: 'apple-reminders-account'
          timeout: 20000
      - runFlow: ../common/close-settings.yaml
      - assertVisible: 'Today'
      - runFlow: ../common/open-new-event.yaml
      - runFlow: ../common/switch-to-task.yaml
      # The first pass after connecting has to land before the Reminder kind shows.
      - extendedWaitUntil:
          visible:
            id: 'mode-reminder'
          timeout: 30000
# The Reminder kind opens the Reminders form on the default list
# ('Reminders' is the default list name; the kind picks it).
- runFlow:
    when:
      visible:
        id: 'mode-reminder'
    commands:
      - tapOn:
          id: 'mode-reminder'
      - assertVisible: 'New Reminder'
      # The quick-add field's keyboard covers the lower rows and Maestro's
      # visibility check ignores it (see 03): a tap on the priority chip
      # would land on the keyboard. A plain label dismisses it first.
      - tapOn: 'LIST'
      - waitForAnimationToEnd:
          timeout: 5000
      # The form morphed: Reminders-only controls are on screen.
      - assertVisible:
          id: 'reminder-timed'
      - assertVisible:
          id: 'reminder-priority-high'
      - tapOn:
          id: 'reminder-priority-high'
      - tapOn:
          id: 'reminder-timed'
      - assertVisible:
          id: 'reminder-time'
      - tapOn:
          id: 'task-title'
      # ASCII only: unicode through XCTest typing is a known flaky spot.
      - inputText: 'Solunivo e2e reminder to delete'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'New Reminder'
          timeout: 20000
      # Timed reminders live in the time grid. Their compact title keeps the
      # priority marker while the due time is exposed by the body label.
      - extendedWaitUntil:
          visible: 'Solunivo e2e reminder to delete, due .*'
          timeout: 10000
      # Two task lists now (the Google one and Reminders), so the Tasks tab
      # offers its list filter: the Reminders chip keeps the reminder and
      # drops the Google task. It stays selected for the end of the flow.
      - tapOn: 'Tasks'
      - assertVisible:
          id: 'tasks-screen'
      - tapOn: 'Reminders'
      - assertVisible:
          text: 'Reminders'
          selected: true
      - assertVisible: '.*Solunivo e2e reminder to delete.*'
      - assertNotVisible: 'Fixture task.*'
      - tapOn: 'Calendar'
      - assertVisible: 'Today'
      # Experimental: Maestro's slow swipe has no configurable hold phase, so
      # it is not a reliable substitute for the native long-press pan.
      # Opt in with -e REMINDER_DRAG_TEST=true; see the manual gesture check
      # in docs/google-sync-and-testing.md before claiming drag coverage.
      - runFlow:
          when:
            true: ${typeof REMINDER_DRAG_TEST !== 'undefined' && REMINDER_DRAG_TEST === 'true'}
          commands:
            - swipe:
                from:
                  text: 'Solunivo e2e reminder to delete, due .*'
                direction: DOWN
                duration: 3000
            - extendedWaitUntil:
                notVisible: 'Solunivo e2e reminder to delete, due .*'
                timeout: 10000
            - extendedWaitUntil:
                visible: 'Solunivo e2e reminder to delete, due (1[0-2]|[1-9]):(00|15|30|45) (AM|PM)'
                timeout: 10000
            - copyTextFrom:
                text: 'Solunivo e2e reminder to delete, due .*'
            - evalScript: ${output.movedReminderLabel = maestro.copiedText}
            - assertTrue:
                condition: ${/due (9:(15|30|45)|1[01]:(00|15|30|45)) AM$|due (1[0-2]|[1-9]):(00|15|30|45) PM$/.test(output.movedReminderLabel)}
                label: The reminder moved later than 9 AM onto a quarter-hour
            # A selector swipe ends relative to screen height, so its exact
            # minute delta varies by device. Preserve the observed snapped
            # time and require it to survive an app restart (storage read).
            - stopApp
            - runFlow: ../common/launch.yaml
            - runFlow:
                file: ../common/switch-view.yaml
                env:
                  VIEW: 'Day'
            - scrollUntilVisible:
                element:
                  text: '${output.movedReminderLabel}'
                direction: DOWN
                timeout: 10000
            - tapOn: '${output.movedReminderLabel}'
            - assertVisible: 'Edit Reminder'
            - waitForAnimationToEnd:
                timeout: 5000
            - assertVisible:
                id: 'reminder-time'
            # Reopening/saving must retain the exact stored label. The native
            # picker value itself still needs the documented manual check.
            - tapOn:
                id: 'event-save'
            - extendedWaitUntil:
                notVisible: 'Edit Reminder'
                timeout: 10000
            - assertVisible: '${output.movedReminderLabel}'
      - tapOn: 'Solunivo e2e reminder to delete, due .*'
      - assertVisible: 'Edit Reminder'
      - waitForAnimationToEnd:
          timeout: 5000
      # Removing the time moves the same reminder into the all-day lane.
      - tapOn:
          id: 'reminder-timed'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'Solunivo e2e reminder to delete, due .*'
          timeout: 10000
      - assertVisible: '!!! Solunivo e2e reminder to delete'
      # Adding the time back returns it to the time grid.
      - tapOn: '!!! Solunivo e2e reminder to delete'
      - assertVisible: 'Edit Reminder'
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          id: 'reminder-timed'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'Edit Reminder'
          timeout: 10000
      - scrollUntilVisible:
          element:
            text: 'Solunivo e2e reminder to delete, due .*'
          direction: UP
          timeout: 10000
      - extendedWaitUntil:
          visible: 'Solunivo e2e reminder to delete, due .*'
          timeout: 10000
      - tapOn: 'Solunivo e2e reminder to delete, due .*'
      - assertVisible: 'Edit Reminder'
      - waitForAnimationToEnd:
          timeout: 5000
      # A monthly "2nd Tuesday" rule: these chips set rather than toggle, so
      # the steps hold on any date (weekday chips start on today's weekday).
      - scrollUntilVisible:
          element:
            id: 'reminder-repeat-monthly'
          direction: DOWN
      - tapOn:
          id: 'reminder-repeat-monthly'
      - tapOn:
          id: 'reminder-repeat-monthly-weekday'
      - tapOn:
          id: 'reminder-repeat-ordinal-2'
      - tapOn:
          id: 'reminder-repeat-ordinal-weekday-TU'
      # The summary sits under the chip rows, below the fold on a phone.
      - scrollUntilVisible:
          element:
            id: 'reminder-repeat-summary'
          direction: DOWN
      - assertVisible: 'Monthly on the 2nd Tuesday.*'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'Edit Reminder'
          timeout: 10000
      # Still due today; the label now ends in ", repeats".
      - extendedWaitUntil:
          visible: 'Solunivo e2e reminder to delete, due .*'
          timeout: 10000
      - tapOn: 'Solunivo e2e reminder to delete, due .*'
      - assertVisible: 'Edit Reminder'
      - waitForAnimationToEnd:
          timeout: 5000
      # EventKit handed the rule back: the ordinal chips reopen selected.
      - scrollUntilVisible:
          element:
            id: 'reminder-repeat-ordinal-2'
          direction: DOWN
      - assertVisible:
          id: 'reminder-repeat-ordinal-2'
          selected: true
      - assertVisible:
          id: 'reminder-repeat-ordinal-weekday-TU'
          selected: true
      # With a second account in the list picker Delete is below the fold:
      # scroll first, like 08.
      - scrollUntilVisible:
          element:
            id: 'task-delete'
          direction: DOWN
      - tapOn:
          id: 'task-delete'
      # The confirmation alert (deleteQuestion).
      - tapOn: 'Delete'
      - extendedWaitUntil:
          notVisible: 'Edit Reminder'
          timeout: 20000
      # The write-through removes the mirror row, so a broken
      # reminders.delete would leave the block on screen.
      - extendedWaitUntil:
          notVisible: '.*Solunivo e2e reminder to delete.*'
          timeout: 10000
      # Undo the connection this flow made, like 17 does.
      - runFlow:
          when:
            true: ${output.connectedReminders === true}
          commands:
            - runFlow: ../common/open-settings.yaml
            - runFlow:
                file: ../common/open-settings-page.yaml
                env:
                  PAGE: device
            - scrollUntilVisible:
                element:
                  id: 'remove-account-apple-reminders'
                direction: DOWN
                timeout: 10000
            - tapOn:
                id: 'remove-account-apple-reminders'
            # Gone: the row just tapped disappears with the account (the access row
            # may be scrolled off by now, so its absence would prove nothing), and
            # the access row offers Connect again.
            - extendedWaitUntil:
                notVisible:
                  id: 'remove-account-apple-reminders'
                timeout: 20000
            - scrollUntilVisible:
                element:
                  id: 'connect-reminders'
                direction: UP
                timeout: 10000
            - runFlow: ../common/close-settings.yaml
            - assertVisible: 'Today'
            # The Tasks tab still had the Reminders chip selected. With the
            # list gone (and the chip row with it, one list left) the filter
            # falls back to All rather than leaving "Nothing to do." with no
            # chip to clear it.
            - tapOn: 'Tasks'
            - extendedWaitUntil:
                visible: 'Fixture task.*'
                timeout: 10000
            - assertNotVisible: 'Nothing to do.'
            - tapOn: 'Calendar'
            - assertVisible: 'Today'
# Keyed on the sheet still being open (see 08): after the branch above
# closed it, "no Reminder kind visible" would be true for the wrong
# reason and the Cancel tap would fail.
- runFlow:
    when:
      visible: 'New (Task|Reminder)'
    commands:
      - tapOn: 'Cancel'
      - assertVisible: 'Today'
