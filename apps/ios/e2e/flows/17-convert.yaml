appId: com.solunivo.app.dev
name: A reminder converts to an event and back, then to a Google task and back
tags:
  - ci
---
# Needs the fixture Google account (Metro started with
# EXPO_PUBLIC_CALENDAR_GOOGLE=fixture, as CI does) beside a connected
# Reminders list. Without the fixture the flow is a no-op, like 07/08.
# One reminder takes both paths of the editor's kind control: to an event
# and back, and to a Google task and back. Google writes go
# to the in-process fake API, so each converted item's create pushes and
# its temp id becomes a server id mid-flow — every selector below is a
# title, never an id.
- runFlow: ../common/launch.yaml
- tapOn: 'Today'
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: 'Day'
- runFlow: ../common/open-new-event.yaml
- runFlow: ../common/switch-to-task.yaml
- runFlow:
    when:
      visible: 'fixture@solunivo.test'
    commands:
      # Reminders must be connected too (the CI simulator's grant is
      # pre-seeded): connect here unless it already is, and remove the
      # account again at the end, leaving the simulator as found.
      - evalScript: ${output.connectedReminders = false}
      - runFlow:
          when:
            notVisible:
              id: 'mode-reminder'
          commands:
            - evalScript: ${output.connectedReminders = true}
            - tapOn: 'Cancel'
            - runFlow: ../common/open-settings.yaml
            - runFlow:
                file: ../common/open-settings-page.yaml
                env:
                  PAGE: device
            - tapOn:
                id: 'connect-reminders'
            # The Reminders row's subtitle carries this id only while the account exists.
            - extendedWaitUntil:
                visible:
                  id: 'apple-reminders-account'
                timeout: 20000
            - runFlow: ../common/close-settings.yaml
            - assertVisible: 'Today'
            - runFlow: ../common/open-new-event.yaml
            - runFlow: ../common/switch-to-task.yaml
      - extendedWaitUntil:
          visible:
            id: 'mode-reminder'
          timeout: 30000

      # A timed reminder to convert.
      - tapOn:
          id: 'mode-reminder'
      - assertVisible: 'New Reminder'
      - assertVisible:
          id: 'reminder-timed'
      - tapOn:
          id: 'reminder-timed'
      - tapOn:
          id: 'task-title'
      # ASCII only: unicode through XCTest typing is a known flaky spot.
      - inputText: 'Solunivo e2e convert'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'New Reminder'
          timeout: 20000
      # A timed reminder's block is "<title>, due <time>".
      - extendedWaitUntil:
          visible: 'Solunivo e2e convert, due .*'
          timeout: 10000

      # Reminder → event: the toggle carries the title and time over and
      # nothing is lost, so Save asks no question.
      - tapOn: 'Solunivo e2e convert, due .*'
      - assertVisible: 'Edit Reminder'
      - tapOn:
          id: 'mode-event'
      - assertVisible: 'Convert to Event'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'Convert to Event'
          timeout: 20000
      # A timed event's block is "<title>, <start> – <end>" (flow 07).
      - extendedWaitUntil:
          visible: 'Solunivo e2e convert, [0-9].*'
          timeout: 10000
      - assertNotVisible: 'Solunivo e2e convert, due .*'

      # Event → reminder: the Reminder kind keeps the time, so again no
      # question.
      - tapOn: 'Solunivo e2e convert, [0-9].*'
      - runFlow: ../common/open-event-editor.yaml
      - tapOn:
          id: 'mode-reminder'
      - assertVisible: 'Convert to Reminder'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'Convert to Reminder'
          timeout: 20000
      - extendedWaitUntil:
          visible: 'Solunivo e2e convert, due .*'
          timeout: 10000
      - tapOn: 'Solunivo e2e convert, due .*'
      - assertVisible: 'Edit Reminder'

      # Reminder → task: the Task kind flips to the Task form on the
      # Google list at once; Save asks what the move drops (the time).
      - tapOn:
          id: 'mode-task'
      - assertVisible: 'Move to Task'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          visible: 'Move task?'
          timeout: 10000
      - tapOn: 'Move'
      - extendedWaitUntil:
          notVisible: 'Move to Task'
          timeout: 20000
      # Date-only now: an all-day chip, no due time in its label.
      - extendedWaitUntil:
          visible: 'Solunivo e2e convert'
          timeout: 10000
      # It reopens as a Google task — the create has pushed to the fake
      # by now, so the chip's id is the server's.
      - tapOn: 'Solunivo e2e convert'
      - assertVisible: 'Edit Task'

      # Google task → reminder: nothing is lost, so no question.
      - tapOn:
          id: 'mode-reminder'
      - assertVisible: 'Move to Reminder'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'Move to Reminder'
          timeout: 20000
      - extendedWaitUntil:
          visible: 'Solunivo e2e convert'
          timeout: 10000
      - tapOn: 'Solunivo e2e convert'
      - assertVisible: 'Edit Reminder'

      # Leave Reminders as found.
      - scrollUntilVisible:
          element:
            id: 'task-delete'
          direction: DOWN
      - tapOn:
          id: 'task-delete'
      # The confirmation alert (deleteQuestion).
      - tapOn: 'Delete'
      - extendedWaitUntil:
          notVisible: 'Edit Reminder'
          timeout: 20000
      - extendedWaitUntil:
          notVisible: 'Solunivo e2e convert.*'
          timeout: 10000
      # Undo the connection this flow made, like 15 does for Apple Calendar.
      - runFlow:
          when:
            true: ${output.connectedReminders === true}
          commands:
            - runFlow: ../common/open-settings.yaml
            - runFlow:
                file: ../common/open-settings-page.yaml
                env:
                  PAGE: device
            - scrollUntilVisible:
                element:
                  id: 'remove-account-apple-reminders'
                direction: DOWN
                timeout: 10000
            - tapOn:
                id: 'remove-account-apple-reminders'
            # Gone: the row just tapped disappears with the account (the access row
            # may be scrolled off by now, so its absence would prove nothing), and
            # the access row offers Connect again.
            - extendedWaitUntil:
                notVisible:
                  id: 'remove-account-apple-reminders'
                timeout: 20000
            - scrollUntilVisible:
                element:
                  id: 'connect-reminders'
                direction: UP
                timeout: 10000
            - runFlow: ../common/close-settings.yaml
            - assertVisible: 'Today'
# No fixture account: leave the sheet as we found it (keyed on the sheet,
# see 08).
- runFlow:
    when:
      visible: 'New (Task|Reminder)'
    commands:
      - tapOn: 'Cancel'
      - assertVisible: 'Today'
