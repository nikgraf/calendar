appId: com.solunivo.app
name: Quick add turns a phrase into a prefilled editor
tags:
  - ci
---
- runFlow: ../common/launch.yaml
# The bar renders only after an async availability check resolves, so wait
# for the marker the app emits either way before deciding to skip —
# checking `quick-add-input` directly would race the mount and report a
# silent pass on hardware that does have a model.
- extendedWaitUntil:
    visible:
      id: 'quick-add-state'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'quick-add-input'
    commands:
      - tapOn:
          id: 'quick-add-input'
      - inputText: 'Lunch with Sarah next Tuesday at 1pm'
      - tapOn:
          id: 'quick-add-submit'
      # Generation runs locally and takes a few seconds.
      - extendedWaitUntil:
          visible: 'New Event'
          timeout: 60000
      # The phrase must have filled the form, not just opened it.
      - assertVisible: 'Lunch with Sarah'
      - tapOn: 'Cancel'
      # Dictation is deliberately not asserted here: Maestro cannot inject
      # audio and simulators carry no speech assets, so the mic disables
      # itself once prepare() fails. Gating an assertion on the mic being
      # visible would pass whether or not it rendered — the transcript path
      # is verified on a real device instead.
