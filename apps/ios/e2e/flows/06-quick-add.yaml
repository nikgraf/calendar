appId: com.solunivo.app.dev
name: Quick add fills the new-event form from a phrase
tags:
  - ci
---
- runFlow: ../common/launch.yaml
# The drafts are drawn on the day timeline and its all-day lane.
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: 'Day'
- runFlow: ../common/open-new-event.yaml
# The quick-add field sits on top of the editor and renders only after an
# async availability check resolves, so wait for the marker the app emits
# either way before deciding to skip — checking `quick-add-input` directly
# would race the mount and report a silent pass on hardware that does have
# a model.
- extendedWaitUntil:
    visible:
      id: 'quick-add-state'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'quick-add-input'
    commands:
      - tapOn:
          id: 'quick-add-input'
      - inputText: 'Lunch with Sarah next Tuesday at 1pm'
      - tapOn:
          id: 'quick-add-apply'
      # Generation runs locally and takes a few seconds. A simulator whose
      # host has no usable model (CI runners: Apple Intelligence is not
      # enabled) passes the availability check and then fails to
      # generate — the field shows its "couldn't be read" copy. Either
      # outcome proves the field, Apply and the error path; the filled
      # form is asserted wherever a model actually answers. The phrase
      # must have been read, not just echoed: the e2e bundle's fixture
      # model (CI) makes the whole phrase the title; a real model
      # extracts "Lunch with Sarah". The title is checked by id — the
      # quick-add field above it holds the same words.
      - extendedWaitUntil:
          visible:
            id: 'event-title'
            text: 'Lunch with Sarah.*'
          timeout: 60000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: 'event-title'
              text: 'Lunch with Sarah.*'
          commands:
            - assertVisible: 'That couldn.t be read.*'
      # The thread, under the fixture model (CI's bundle) — its signal is the
      # whole phrase as the title; a real model extracts "Lunch with Sarah"
      # and the steps below are skipped. A change in the fixture's grammar
      # (empty parts unchanged) moves the times and lists a turn; Undo takes
      # it back; a finder phrase as a later turn puts the draft in the best
      # free slot of next week's mornings and offers the others as chips.
      # The calendar behind the sheet draws the draft: lowered to half
      # height (a tap on the grabber), it shows the draft's day with a
      # dashed block the grid scrolled to above the sheet, and the block
      # follows a change.
      - runFlow:
          when:
            visible:
              id: 'event-title'
              text: 'Lunch with Sarah next Tuesday at 1pm'
          commands:
            - assertVisible:
                id: 'draft-thread'
            - tapOn: 'Expanded'
            - waitForAnimationToEnd:
                timeout: 3000
            - assertVisible:
                id: 'draft-block'
                text: 'Draft: Lunch with Sarah.*'
            - tapOn:
                id: 'quick-add-input'
            - inputText: '| | 20:00-21:00'
            - tapOn:
                id: 'quick-add-apply'
            - extendedWaitUntil:
                visible:
                  id: 'draft-turn-summary'
                  text: '.*20:00.21:00.*'
                timeout: 20000
            - waitForAnimationToEnd:
                timeout: 3000
            - assertVisible:
                id: 'draft-block'
                text: 'Draft: Lunch with Sarah.*(8:00.PM|20:00).*'
            - runFlow: ../common/expand-editor.yaml
            - tapOn:
                id: 'draft-undo'
            - extendedWaitUntil:
                notVisible:
                  id: 'draft-turn-summary'
                  text: '.*20:00.21:00.*'
                timeout: 10000
            - tapOn:
                id: 'quick-add-input'
            - inputText: 'find 30 min next week mornings | Focus'
            - tapOn:
                id: 'quick-add-apply'
            - extendedWaitUntil:
                visible:
                  id: 'draft-slots'
                timeout: 20000
            - assertVisible:
                id: 'draft-slot-0'
                selected: true
            # The draft keeps its title; only its time moved.
            - assertVisible:
                id: 'event-title'
                text: 'Lunch with Sarah next Tuesday at 1pm'
            - tapOn:
                id: 'draft-slot-1'
            - assertVisible:
                id: 'draft-slot-1'
                selected: true
      # Dictation is deliberately not asserted here: Maestro cannot inject
      # audio and simulators carry no speech assets, so the mic disables
      # itself once prepare() fails. Gating an assertion on the mic being
      # visible would pass whether or not it rendered — the transcript path
      # is verified on a real device instead.
- tapOn: 'Cancel'
- assertVisible: 'Today'
