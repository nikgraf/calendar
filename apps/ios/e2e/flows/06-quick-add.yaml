appId: com.solunivo.app.dev
name: The Assistant makes a new event from a phrase and changes it by the next
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-new-item.yaml
# The Assistant's bar renders only after an async availability check
# resolves, so wait for the marker the app emits either way before
# deciding to skip — checking `quick-add-type` directly would race the
# mount and report a silent pass on hardware that does have a model. Under
# the fixture model (CI's bundle) the marker's id ends in `-fixture`.
# Without a model the editor has fallen back to its form by then, and
# there is nothing to say a phrase to.
- extendedWaitUntil:
    visible:
      id: 'editor-view-(form|assistant)'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'quick-add-type'
    commands:
      # Save with nothing said: the form that says why nothing was saved is
      # behind the Assistant, so the Assistant says it over its bar. The
      # first phrase to land takes the line away again.
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          visible:
            id: 'editor-error'
            text: 'A title and calendar are required.'
          timeout: 5000
      # Each phrase is typed until the field holds all of it (XCTest
      # garbles input), then sent.
      - runFlow:
          file: ../common/apply-quick-add.yaml
          env:
            PHRASE: 'Lunch with Sarah | +1 | 13:00-14:00'
      # Generation runs locally and takes a few seconds. A simulator whose
      # host has no usable model (CI runners: Apple Intelligence is not
      # enabled) passes the availability check and then fails to
      # generate — the bar's line shows its "couldn't be read" copy. Either
      # outcome proves the field, the send and the error path; the answer
      # is asserted wherever a model actually answers: the event as a card.
      - extendedWaitUntil:
          visible:
            id: 'assistant-card-title'
            text: 'Lunch with Sarah.*'
          timeout: 60000
          optional: true
      # The read outcome sets a flag the other one is keyed on: Maestro
      # gives a `when` condition up to 7 s to come true, so `notVisible:`
      # on the card that is there cost that on every read.
      - runFlow:
          when:
            visible:
              id: 'assistant-card-title'
              text: 'Lunch with Sarah.*'
          commands:
            - evalScript: ${output.read = true}
      - runFlow:
          when:
            true: ${output.read !== true}
          commands:
            - assertVisible: 'That couldn.t be read.*'
      # The thread, under the fixture model (CI's bundle; a real model skips
      # the steps below). The fixture answers the tuned prompt in its
      # grammar (`packages/ai/src/fixtureModel.ts`): title, a day from today
      # and the times. A change in the same grammar (empty parts unchanged)
      # moves the times: the card marks them, the hours before struck
      # through after them, and the first answer becomes a row above. The
      # form shows the same draft; its pill steps back to the first answer,
      # which is looked at until "Use this" keeps it. A finder phrase puts
      # the draft in the best free slot of next week's mornings and offers
      # the others as chips; a phrase that invites makes guests of the
      # contacts it names; one that sets a place takes a past place said
      # by sound.
      - runFlow:
          when:
            visible:
              id: 'quick-add-state-fixture'
          commands:
            - assertVisible:
                id: 'assistant-card-title'
                text: 'Lunch with Sarah'
            - assertVisible:
                id: 'assistant-said'
                text: 'Lunch with Sarah \| \+1 \| 13:00-14:00'
            - runFlow:
                file: ../common/apply-quick-add.yaml
                env:
                  PHRASE: '| | 20:00-21:00'
            - extendedWaitUntil:
                visible:
                  id: 'assistant-card-time'
                  text: '.*20:00.21:00.*13:00.14:00.*'
                timeout: 20000
            - assertVisible:
                id: 'assistant-changed'
                text: 'Changed: time'
            - assertVisible:
                id: 'assistant-version'
            # The form: the same draft, two steps under it.
            - tapOn:
                id: 'assistant-edit'
            - extendedWaitUntil:
                visible:
                  id: 'event-title'
                  text: 'Lunch with Sarah'
                timeout: 5000
            # The form rises out of the card: settled before the pill is tapped.
            - waitForAnimationToEnd:
                timeout: 3000
            - assertVisible:
                id: 'step-position'
                text: '2 of 2'
            # One back: the first answer on show, to keep or to leave.
            - tapOn:
                id: 'step-back'
            - extendedWaitUntil:
                visible:
                  id: 'step-preview'
                timeout: 5000
            - assertVisible:
                id: 'step-position'
                text: '1 of 2'
            - tapOn:
                id: 'step-use'
            - extendedWaitUntil:
                visible:
                  id: 'step-position'
                  text: '1 of 1'
                timeout: 5000
            - assertNotVisible:
                id: 'step-preview'
            # Back in the conversation the change is gone with its step.
            - tapOn:
                id: 'editor-view-assistant'
            - extendedWaitUntil:
                visible:
                  id: 'assistant-card-time'
                  text: '.*13:00.14:00.*'
                timeout: 5000
            - waitForAnimationToEnd:
                timeout: 3000
            - runFlow:
                file: ../common/apply-quick-add.yaml
                env:
                  PHRASE: 'find 30 min next week mornings | Focus'
            - extendedWaitUntil:
                visible:
                  id: 'draft-slots'
                timeout: 20000
            - assertVisible:
                id: 'draft-slot-0'
                selected: true
            # The draft keeps its title; only its time moved.
            - assertVisible:
                id: 'assistant-card-title'
                text: 'Lunch with Sarah'
            - tapOn:
                id: 'draft-slot-1'
            - assertVisible:
                id: 'draft-slot-1'
                selected: true
            # A phrase that invites: the fixture names whoever follows
            # "invite", and each name is looked up in the account's
            # contacts. "Anna Lee" is one contact: a guest on the card.
            # "Tom" is two (Tom Lee, Tom Wright): a question, numbered
            # among those the phrase brought, nothing picked until a tap —
            # the first is Tom Lee.
            - runFlow:
                file: ../common/apply-quick-add.yaml
                env:
                  PHRASE: 'invite Anna Lee and Tom'
            - extendedWaitUntil:
                visible:
                  id: 'draft-question'
                timeout: 20000
            - assertVisible:
                id: 'draft-question-count'
                text: 'QUESTION 1 OF 1'
            - assertVisible: 'Which Tom\?'
            - tapOn:
                id: 'draft-invitee-pick-0-0'
            - extendedWaitUntil:
                notVisible:
                  id: 'draft-question'
                timeout: 5000
            - extendedWaitUntil:
                visible:
                  id: 'assistant-card-guests'
                  text: '.*Anna Lee.*Tom Lee.*'
                timeout: 5000
            # A phrase that sets a place: the fixture takes the location
            # part as written, and the thread finds it among the past
            # places by sound — the fixture coffee at Café Central — so the
            # card reads the place's own text.
            - runFlow:
                file: ../common/apply-quick-add.yaml
                env:
                  PHRASE: '| | | Cafe Zentral'
            - extendedWaitUntil:
                visible:
                  id: 'assistant-card-location'
                  text: '.*Café Central.*'
                timeout: 20000
      # Dictation is deliberately not asserted here: Maestro cannot inject
      # audio and simulators carry no speech assets, so the mic disables
      # itself once prepare() fails. Gating an assertion on the mic being
      # visible would pass whether or not it rendered — the transcript path
      # is verified on a real device instead.
- tapOn: 'Cancel'
- assertVisible: 'Today'
