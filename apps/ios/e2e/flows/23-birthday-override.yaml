appId: com.solunivo.app.dev
name: Birthday reminders persist and reset, per person and for everyone
tags:
  - ci
---
# Needs the fixture Google account (EXPO_PUBLIC_CALENDAR_GOOGLE=fixture,
# as CI does): its contacts hold "Birthday Fixture", a week from today in
# today's month (e2e/fixtures/google.ts), reached from the month grid.
- runFlow: ../common/launch.yaml
# Straight to the month grid: the app reopens on the last view it was in.
# A tap on a menu item can report COMPLETED with the menu still open (run
# 37944409989 sat on the day view behind it): re-pick until the header
# reads like a month ("October 2026" — two-day and week titles carry day
# numbers and a comma). The header proves the pick, the way
# common/open-new-event.yaml proves its tap; picking Month on the month
# view changes nothing.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          file: ../common/switch-view.yaml
          env:
            VIEW: 'Month'
      - extendedWaitUntil:
          visible:
            id: 'day-title'
            text: '[A-Z][a-z]+ 20\d\d'
          timeout: 5000
# The cell's label counts its items ("Friday, October 9, 1 birthday");
# the People sync lands shortly after launch.
- extendedWaitUntil:
    visible: '.*, 1 birthday.*'
    timeout: 20000
- tapOn: '.*, 1 birthday.*'
- tapOn:
    id: 'birthday-chip'
- extendedWaitUntil:
    visible:
      id: 'birthday-detail'
    timeout: 5000
- assertVisible: 'Birthday Fixture'
# The rows start on the general reminders ("On the day" by default), one
# row per reminder. Add two weeks for this person only, from the action
# sheet of lead times not taken. The general switch is never touched (it
# would raise the permission alert).
- assertVisible:
    id: 'birthday-override-0'
- scrollUntilVisible:
    element:
      id: 'birthday-override-add'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'birthday-override-add'
- tapOn: '2 weeks before'
- extendedWaitUntil:
    visible:
      id: 'birthday-override-14'
    timeout: 5000
- assertVisible:
    id: 'birthday-override-reset'
- tapOn: 'Done'
# Reopen: stored (device-local SQLite), not just React state.
- tapOn:
    id: 'birthday-chip'
- extendedWaitUntil:
    visible:
      id: 'birthday-override-14'
    timeout: 5000
# Settings › Notifications lists the person under "Custom per Person".
- tapOn: 'Done'
- runFlow: ../common/open-settings.yaml
# The root offers another Google account even with one signed in.
- assertVisible: 'Add Google Account'
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: notifications
- assertVisible:
    id: 'birthday-reminders'
- assertVisible: 'Birthday Reminders'
- scrollUntilVisible:
    element:
      id: 'birthday-overrides'
    direction: DOWN
    timeout: 10000
- assertVisible: 'Birthday Fixture.*'
# Reset from Settings (swipe the row, tap Reset) leaves the state as found
# for the next flow.
- swipe:
    from:
      id: 'birthday-override-row-0'
    direction: LEFT
- tapOn:
    id: 'birthday-override-reset-0'
- extendedWaitUntil:
    notVisible:
      id: 'birthday-overrides'
    timeout: 5000
# The general reminders, for everyone without their own, persist too,
# on the page itself (no page pushed over it). "On the day" is the
# default; add a week ahead. The enable switch is never touched: it would
# raise the notification permission alert on the simulator.
- scrollUntilVisible:
    element:
      id: 'birthday-reminder-add'
    direction: UP
    timeout: 10000
- assertVisible:
    id: 'birthday-reminder-0'
- tapOn:
    id: 'birthday-reminder-add'
- tapOn: '1 week before'
- extendedWaitUntil:
    visible:
      id: 'birthday-reminder-7'
    timeout: 5000
- runFlow: ../common/close-settings.yaml
# Reopen: the choice was stored (device-local SQLite), not just React state.
- runFlow: ../common/open-settings.yaml
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: notifications
- scrollUntilVisible:
    element:
      id: 'birthday-reminder-7'
    direction: DOWN
    timeout: 10000
# Leave the settings as found for the next flow: swipe the week away.
- swipe:
    from:
      id: 'birthday-reminder-7'
    direction: LEFT
- tapOn:
    id: 'birthday-reminder-7-delete'
- extendedWaitUntil:
    notVisible:
      id: 'birthday-reminder-7'
    timeout: 5000
- assertVisible:
    id: 'birthday-reminder-0'
- runFlow: ../common/close-settings.yaml
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: 'Day'
- tapOn: 'Today'
- assertVisible:
    id: 'day-timeline'
