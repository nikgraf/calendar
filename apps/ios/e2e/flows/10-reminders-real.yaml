appId: com.solunivo.app
name: Real Reminders on CI - connect, create through EventKit, delete
tags:
  - ci
  - ci-reminders
---
# The strict sibling of flow 09, for CI only: the simulator's Reminders
# grant is pre-seeded (simctl privacy), so every step must succeed —
# there is no "no account connected" escape hatch here. Locally run it
# only on a simulator prepared the same way (apps/ios/e2e/ci/).
- runFlow: ../common/launch.yaml

# Connect: the grant is already answered, so no prompt appears and the
# synthetic Apple account shows up in the accounts list.
- runFlow: ../common/open-settings.yaml
- assertVisible: 'Accounts'
- tapOn:
    id: 'connect-reminders'
- extendedWaitUntil:
    visible: 'Apple Reminders'
    timeout: 20000
- tapOn: 'Done'
- assertVisible: 'Today'

# Create through EventKit. The list picker shows the mirrored lists; the
# first pass after connecting has to land first, hence the wait. Rows are
# found by id: their label is title + swatch + check mark, which a
# whole-string text selector never matches.
- runFlow: ../common/open-new-event.yaml
- runFlow: ../common/switch-to-task.yaml
- extendedWaitUntil:
    visible:
      id: 'task-list-option'
    timeout: 30000
- tapOn:
    id: 'task-list-option'
- assertVisible:
    id: 'reminder-timed'
- tapOn:
    id: 'reminder-priority-high'
- tapOn:
    id: 'reminder-timed'
- assertVisible:
    id: 'reminder-time'
# A monthly "2nd Tuesday" rule: these chips set rather than toggle, so the
# steps hold on any date (weekday chips start on today's weekday).
- scrollUntilVisible:
    element:
      id: 'reminder-repeat-monthly'
    direction: DOWN
- tapOn:
    id: 'reminder-repeat-monthly'
- tapOn:
    id: 'reminder-repeat-monthly-weekday'
- tapOn:
    id: 'reminder-repeat-ordinal-2'
- tapOn:
    id: 'reminder-repeat-ordinal-weekday-TU'
# The summary sits under the chip rows, below the fold on a phone.
- scrollUntilVisible:
    element:
      id: 'reminder-repeat-summary'
    direction: DOWN
- assertVisible: 'Monthly on the 2nd Tuesday.*'
- scrollUntilVisible:
    element:
      id: 'task-title'
    direction: UP
- tapOn:
    id: 'task-title'
- inputText: 'Solunivo ci reminder'
- tapOn:
    id: 'event-save'
- extendedWaitUntil:
    notVisible: 'New Task'
    timeout: 20000
# The timed block came back from EventKit with a real identifier and was
# mirrored into the time grid.
- extendedWaitUntil:
    visible: 'Solunivo ci reminder, due .*'
    timeout: 10000

# Delete through EventKit; the write-through removes the mirror row, so
# a broken reminders.delete would leave the block on screen. Target the
# body label so the adjacent completion checkbox is never selected.
- tapOn: 'Solunivo ci reminder, due .*'
- assertVisible: 'Edit Reminder'
# EventKit handed the rule back: the ordinal chip reopens selected.
- scrollUntilVisible:
    element:
      id: 'reminder-repeat-ordinal-2'
    direction: DOWN
- assertVisible:
    id: 'reminder-repeat-ordinal-2'
    selected: true
- assertVisible:
    id: 'reminder-repeat-ordinal-weekday-TU'
    selected: true
- scrollUntilVisible:
    element:
      id: 'task-delete'
    direction: DOWN
- tapOn:
    id: 'task-delete'
- extendedWaitUntil:
    notVisible: 'Edit Reminder'
    timeout: 20000
- extendedWaitUntil:
    notVisible: '.*Solunivo ci reminder'
    timeout: 10000
