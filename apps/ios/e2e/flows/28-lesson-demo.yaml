appId: com.solunivo.app.dev
name: Create with AI runs its demo before the Assistant's model is here
tags:
  - ci
---
# Under the fixture model the Assistant's model is always there. The
# `onboarding-fixture?assistant=absent` link has it read as not asked
# for yet, for this launch only (each flow launches the app afresh), so
# the Create lesson runs its demo: the lesson's phrase and its change
# answered on the real editor, the download offered in the banner. A
# bundle without the fixture ignores the link, and the flow passes
# without asserting.
- runFlow: ../common/launch.yaml
- openLink: 'solunivo-dev://onboarding-fixture?assistant=absent'
# The "Open in Solunivo Dev?" alert, as in flow 26.
- extendedWaitUntil:
    visible: 'Open'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            true: ${output.cancelAlert === true}
          commands:
            - tapOn: 'Cancel'
      - evalScript: ${output.cancelAlert = true}
      - extendedWaitUntil:
          notVisible: 'Open'
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'setup-welcome'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: 'setup-welcome'
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      # The fixture account is connected: skipping the setup leaves the
      # card with every lesson.
      - tapOn:
          id: 'setup-skip'
      - extendedWaitUntil:
          visible:
            id: 'getting-started'
          timeout: 10000
      # The Create row says the Assistant is a download and the demo is there meanwhile.
      - assertVisible:
          id: 'getting-started-subtitle-create'
          text: 'Try the demo · the Assistant downloads once'
      - tapOn:
          id: 'getting-started-row-create'
      # The banner says what the Assistant is and offers its download; the
      # bar holds the lesson's phrase as the demo's.
      - extendedWaitUntil:
          visible:
            id: 'lesson-model-action'
            text: 'Download.*'
          timeout: 10000
      - assertVisible:
          id: 'lesson-banner-note'
          text: '.*a small model trained on calendar phrases, running on this iPhone.*'
      - extendedWaitUntil:
          visible:
            id: 'quick-add-demo-phrase'
            text: 'Lunch with Sam tomorrow at 12:30 at Mercato'
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      # The phrase: the real card, from the demo's stored answer.
      - tapOn:
          id: 'quick-add-demo-send'
      - extendedWaitUntil:
          visible:
            id: 'assistant-card-title'
            text: 'Lunch with Sam'
          timeout: 15000
      - assertVisible:
          id: 'assistant-card-time'
          text: '.*12:30–13:30.*'
      - assertVisible:
          id: 'assistant-demo-note'
      # Then its change, a step of its own.
      - extendedWaitUntil:
          visible:
            id: 'quick-add-demo-phrase'
            text: 'at 1 instead'
          timeout: 10000
      - tapOn:
          id: 'quick-add-demo-send'
      - extendedWaitUntil:
          visible:
            id: 'assistant-card-time'
            text: '.*13:00–14:00.*'
          timeout: 15000
      # Through: the bar waits for the model.
      - extendedWaitUntil:
          visible: 'The Assistant answers anything once its model is here.'
          timeout: 5000
      - tapOn: 'Cancel'
      - extendedWaitUntil:
          visible: 'Create with AI, done'
          timeout: 10000
