appId: com.solunivo.app.dev
name: Connect Apple Calendar and pick one of its calendars for a new event
tags:
  - ci
---
# launchApp pre-grants Calendars access, so connecting shows no prompt.
# Seed-free: the simulator's own Calendar app calendars are what appears.
# The flow is a no-op on a dev client built before the module existed
# (the connect row still shows, but connecting reports "unavailable").
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-settings.yaml
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: device
- runFlow:
    when:
      visible:
        id: 'connect-apple-calendar'
    commands:
      - tapOn:
          id: 'connect-apple-calendar'
      # The Calendar row's subtitle carries this id only while the account exists.
      - extendedWaitUntil:
          visible:
            id: 'apple-calendar-account'
          timeout: 20000
- runFlow:
    when:
      visible:
        id: 'apple-calendar-account'
    commands:
      - runFlow: ../common/close-settings.yaml
      - runFlow: ../common/open-new-event.yaml
      # Apple calendars are grouped under their EventKit source.
      - assertVisible: '(?i)apple calendar · .*'
      - tapOn: 'Cancel'
      # Leave no Apple Calendar account behind: the other flows must not
      # find its calendars (flow 07 would start writing to it).
      - runFlow: ../common/open-settings.yaml
      - runFlow:
          file: ../common/open-settings-page.yaml
          env:
            PAGE: device
      - scrollUntilVisible:
          element:
            id: 'remove-account-apple-calendar'
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: 'remove-account-apple-calendar'
      # Gone: the row just tapped disappears with the account (the access row
      # may be scrolled off by now, so its absence would prove nothing), and
      # the access row offers Connect again.
      - extendedWaitUntil:
          notVisible:
            id: 'remove-account-apple-calendar'
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: 'connect-apple-calendar'
          direction: UP
          timeout: 10000
      - runFlow: ../common/close-settings.yaml
