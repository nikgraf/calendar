appId: com.solunivo.app
name: Swiping the timeline changes days
---
- launchApp
# The app re-bundles from Metro on a cold dev-client launch; wait for the
# calendar shell rather than racing it.
- extendedWaitUntil:
    visible: 'Today'
    timeout: 60000
- tapOn: 'Day'
# The header shows the focused day, e.g. "Fri, August 21".
- assertVisible:
    id: 'day-timeline'
- copyTextFrom:
    id: 'day-title'
- swipe:
    id: 'day-timeline'
    direction: LEFT
# A left swipe moves forward a day, so the header must change.
- assertNotVisible: '${maestro.copiedText}'
- swipe:
    id: 'day-timeline'
    direction: RIGHT
# Swiping back returns to the original day.
- assertVisible: '${maestro.copiedText}'
