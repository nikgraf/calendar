appId: com.solunivo.app.dev
name: An all-day event chip opens its editor
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-new-event.yaml
# Saving needs a writable calendar, so this runs only where an account is
# signed in; everywhere else the flow is a no-op (same shape as 07).
- runFlow:
    when:
      visible:
        id: 'calendar-option'
    commands:
      - tapOn:
          id: 'calendar-option'
          index: 0
      # All-day first, while no keyboard is up (a new event's editor focuses
      # nothing): after typing the title its keyboard covers the switch, and
      # Maestro's visibility check ignores it, so the tap landed on the
      # keyboard and the event saved as a timed 9-10 block.
      - tapOn:
          id: 'event-all-day'
      - tapOn:
          id: 'event-title'
      # ASCII only — unicode through XCTest typing is a known flaky spot.
      - inputText: 'Solunivo e2e all-day to delete'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'New Event'
          timeout: 20000
      # The chip sits in the all-day lane above the grid. It used to be a
      # plain View — visible, but a tap did nothing on the phone.
      - assertVisible:
          id: 'all-day-event-chip'
      - tapOn: 'Solunivo e2e all-day to delete'
      - runFlow: ../common/open-event-editor.yaml
      # Clean up, so repeated runs don't pile up in a real calendar.
      # Delete is the form's last card: scroll it into reach.
      - scrollUntilVisible:
          element:
            id: 'event-delete'
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: 'event-delete'
      # The confirmation alert (deleteQuestion).
      - tapOn: 'Delete'
      - extendedWaitUntil:
          notVisible: 'Solunivo e2e all-day to delete'
          timeout: 20000
      - evalScript: ${output.sheetClosed = true}
# Keyed on the sheet still being open, by a flag (see 08).
- runFlow:
    when:
      true: ${output.sheetClosed !== true}
    commands:
      # No account: leave the sheet as we found it.
      - tapOn: 'Cancel'
      - assertVisible: 'Today'
