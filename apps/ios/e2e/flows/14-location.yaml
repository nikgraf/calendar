appId: com.solunivo.app
name: The location field suggests places and maps a picked one
# No `ci` tag: the suggestions and the map come from real MapKit on the
# simulator, so this flow needs the network. Run it locally with
# `pnpm test:e2e:ios`; the waits are optional so an offline run still
# exercises the field itself.
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-new-event.yaml
# The auto-focused title's keyboard covers the lower fields and Maestro's
# visibility check ignores it: dismiss it on a plain label first.
- tapOn: 'LOCATION'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'location-input'
- inputText: 'Apple Park'
- extendedWaitUntil:
    visible:
      id: 'location-suggestion'
    timeout: 15000
    optional: true
- tapOn:
    id: 'location-suggestion'
    index: 0
    optional: true
- extendedWaitUntil:
    visible:
      id: 'open-in-maps'
    timeout: 15000
    optional: true
# Nothing is saved: leave the sheet as we found it.
- tapOn: 'Cancel'
- assertVisible: 'Today'
