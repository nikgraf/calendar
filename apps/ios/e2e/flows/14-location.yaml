appId: com.solunivo.app.dev
name: The location screen suggests places, maps a picked one, and the row's ⓧ removes it
# No `ci` tag: the suggestions and the map come from real MapKit on the
# simulator, so this flow needs the network. Run it locally with
# `pnpm test:e2e:ios`; the waits are optional so an offline run still
# exercises the field itself.
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-new-event.yaml
# A title typed first keeps its focus up to the tap on the row (XCTest's
# typing hid its keyboard, so the row is in reach): the location screen
# must not hand the keyboard back to it when it closes.
- tapOn:
    id: 'event-title'
- inputText: 'Solunivo e2e place'
- scrollUntilVisible:
    element:
      id: 'location-field'
    direction: DOWN
# The row opens the location screen, its search field focused.
- tapOn:
    id: 'location-field'
- inputText: 'Apple Park'
- extendedWaitUntil:
    visible:
      id: 'location-suggestion'
    timeout: 15000
    optional: true
- tapOn:
    id: 'location-suggestion'
    index: 0
    optional: true
# Offline, no place came: Done keeps the text as typed (it is already
# the editor's, written as it was typed).
- tapOn:
    id: 'location-done'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'open-in-maps'
    timeout: 15000
    optional: true
# The title's keyboard did not come back (Maestro reports no focus, but
# it sees the keyboard's keys).
- assertNotVisible: 'space'
# Typed into and cancelled, the screen puts the location back.
- tapOn:
    id: 'location-field'
- inputText: ' zzz'
- assertVisible:
    id: 'location-input'
    text: '.*zzz'
- tapOn:
    id: 'location-cancel'
- assertNotVisible:
    id: 'location-field'
    text: '.*zzz.*'
- assertVisible:
    id: 'location-clear'
# The row's ⓧ takes the location away in one press.
- tapOn:
    id: 'location-clear'
- assertNotVisible:
    id: 'location-clear'
- assertVisible:
    id: 'location-field'
    text: 'Location'
# Nothing is saved: leave the sheet as we found it. The title typed is
# an edit, so Cancel asks first.
- tapOn: 'Cancel'
- tapOn: 'Discard Changes'
- assertVisible: 'Today'
