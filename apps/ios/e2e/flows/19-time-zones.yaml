appId: com.solunivo.app.dev
name: Time zones persist on this device and annotate the hour gutter
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-settings.yaml
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: general
- assertVisible:
    id: 'time-zones'
- assertVisible:
    id: 'time-zones-device-only'
# Nothing stored: the iPhone's own zone is the one row, and the primary.
- assertVisible:
    id: 'time-zone-row-device-primary'
# Honolulu and Kolkata never observe DST and neither is a CI or developer
# device zone, so "noon Honolulu = 3:30 AM Kolkata" holds on any host.
- tapOn:
    id: 'time-zone-add'
# The sheet opens on the whole catalog, its first zone at the top.
- extendedWaitUntil:
    visible:
      id: 'time-zone-option-Africa-Abidjan'
    timeout: 5000
- tapOn:
    id: 'time-zone-search'
- inputText: 'Honolulu'
- tapOn:
    id: 'time-zone-option-Pacific-Honolulu'
- extendedWaitUntil:
    visible:
      id: 'time-zone-row-Pacific-Honolulu'
    timeout: 5000
# A tap on a zone's row makes it the primary (the checked one).
- tapOn:
    id: 'time-zone-row-Pacific-Honolulu'
- extendedWaitUntil:
    visible:
      id: 'time-zone-row-Pacific-Honolulu-primary'
    timeout: 5000
- tapOn:
    id: 'time-zone-add'
- tapOn:
    id: 'time-zone-search'
- inputText: 'Kolkata'
- tapOn:
    id: 'time-zone-option-Asia-Kolkata'
- extendedWaitUntil:
    visible:
      id: 'time-zone-row-Asia-Kolkata'
    timeout: 5000
- runFlow: ../common/close-settings.yaml
# The gutter's second line under noon (in the primary zone, Honolulu)
# names the device zone's hour and Kolkata's 3:30 AM. The localized
# time's spacing (a narrow no-break space before AM) is not pinned, as in
# flows 09 and 17.
- scrollUntilVisible:
    element:
      id: 'hour-secondary-12'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'hour-secondary-12'
    text: '.*3:30.AM'
# Reopen: the choice was stored (device-local SQLite), not just React
# state. Then leave the settings as found for the next flow: removing the
# primary promotes the device zone back (it is never removed itself). A
# zone is removed the iOS way, by swiping its row left and tapping the
# action that slides in.
- runFlow: ../common/open-settings.yaml
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: general
- swipe:
    from:
      id: 'time-zone-row-Asia-Kolkata'
    direction: LEFT
- tapOn:
    id: 'time-zone-remove-Asia-Kolkata'
- extendedWaitUntil:
    notVisible:
      id: 'time-zone-row-Asia-Kolkata'
    timeout: 5000
- swipe:
    from:
      id: 'time-zone-row-Pacific-Honolulu-primary'
    direction: LEFT
- tapOn:
    id: 'time-zone-remove-Pacific-Honolulu'
- extendedWaitUntil:
    notVisible:
      id: 'time-zone-row-Pacific-Honolulu-primary'
    timeout: 5000
- assertVisible:
    id: 'time-zone-row-device-primary'
- runFlow: ../common/close-settings.yaml
- assertNotVisible:
    id: 'hour-secondary-12'
