appId: com.solunivo.app
name: Time zones persist on this device and annotate the hour gutter
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-settings.yaml
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'time-zones'
    direction: DOWN
    timeout: 10000
- assertVisible: 'Time zones'
- assertVisible:
    id: 'time-zones-device-only'
# Honolulu and Kolkata never observe DST and neither is a CI or developer
# device zone, so "noon Honolulu = 3:30 AM Kolkata" holds on any host.
- tapOn:
    id: 'time-zone-add'
- tapOn:
    id: 'time-zone-search'
- inputText: 'Honolulu'
- tapOn:
    id: 'time-zone-option-Pacific-Honolulu'
- extendedWaitUntil:
    visible:
      id: 'time-zone-row-Pacific-Honolulu'
    timeout: 5000
- tapOn:
    id: 'time-zone-make-primary-Pacific-Honolulu'
- extendedWaitUntil:
    visible:
      id: 'time-zone-row-Pacific-Honolulu-primary'
    timeout: 5000
- tapOn:
    id: 'time-zone-add'
- tapOn:
    id: 'time-zone-search'
- inputText: 'Kolkata'
- tapOn:
    id: 'time-zone-option-Asia-Kolkata'
- extendedWaitUntil:
    visible:
      id: 'time-zone-row-Asia-Kolkata'
    timeout: 5000
- tapOn: 'Done'
- assertVisible: 'Today'
# The gutter's second line under noon (in the primary zone, Honolulu)
# names the device zone's hour and Kolkata's 3:30 AM.
- scrollUntilVisible:
    element:
      id: 'hour-secondary-12'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'hour-secondary-12'
    text: '.*3:30 AM'
# Reopen: the choice was stored (device-local SQLite), not just React
# state. Then leave the settings as found for the next flow: removing the
# primary promotes the device zone back.
- runFlow: ../common/open-settings.yaml
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'time-zone-remove-Asia-Kolkata'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'time-zone-remove-Asia-Kolkata'
- extendedWaitUntil:
    notVisible:
      id: 'time-zone-row-Asia-Kolkata'
    timeout: 5000
- tapOn:
    id: 'time-zone-remove-Pacific-Honolulu'
- extendedWaitUntil:
    notVisible:
      id: 'time-zone-row-Pacific-Honolulu-primary'
    timeout: 5000
- tapOn: 'Done'
- assertVisible: 'Today'
- assertNotVisible:
    id: 'hour-secondary-12'
