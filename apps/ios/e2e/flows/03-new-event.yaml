appId: com.solunivo.app.dev
name: The new-event sheet shows the repeat picker, finds a free slot, and turns a typed invitee into a chip
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-new-event.yaml
# The card's header renders uppercase, so the text is REPEAT.
- assertVisible: 'REPEAT'

# The form is worked top to bottom, every scroll downward: Maestro counts
# a row scrolled out above the viewport as visible (the clipping trap),
# so a scroll back up never happens and a tap on the row lands on nothing.

# Find a time: the presets over the pure solver, no model involved. Next
# week always has free mornings in the fixture calendar, whatever today
# is; the pick closes the finder and moves the draft there. The row is
# the dates card's last; a scroll brings it into reach on a shorter phone.
- scrollUntilVisible:
    element:
      id: 'find-time'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'find-time'
- assertVisible:
    id: 'find-time-fields'
- tapOn:
    id: 'find-time-window-nextWeek'
# The rows below the fold are not in Maestro's reach until scrolled to.
- scrollUntilVisible:
    element:
      id: 'find-time-bounds-mornings'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'find-time-bounds-mornings'
- scrollUntilVisible:
    element:
      id: 'find-time-search'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'find-time-search'
- extendedWaitUntil:
    visible:
      id: 'find-time-slot-0'
    timeout: 20000
- tapOn:
    id: 'find-time-slot-0'
- assertNotVisible:
    id: 'find-time-fields'

# Repeat: the finder closing shrank the content, so the chips sit near
# where the finder's rows were. Tap until the chip is selected: on the
# runner the sheet's content still shifted (its own inset) after the
# animation-end wait, so the first tap landed above the chip. The chip's
# state proves the tap, the way common/open-new-event.yaml proves its own.
- scrollUntilVisible:
    element:
      id: 'event-repeat-daily'
    direction: DOWN
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'event-repeat-daily'
              selected: true
          commands:
            - tapOn:
                id: 'event-repeat-daily'
      - extendedWaitUntil:
          visible:
            id: 'event-repeat-daily'
            selected: true
          timeout: 3000
# The rows a repeating rule brings sit under the chips, below the fold.
# Assertions are regexes — the parentheses must be escaped.
- scrollUntilVisible:
    element:
      text: 'Every \(n\)'
    direction: DOWN
    timeout: 10000

# The invitees card is further down the sheet; scroll it into view. No
# keyboard is up here (a new item's editor focuses nothing), so the tap
# lands in the field.
- scrollUntilVisible:
    element:
      id: 'invitee-input'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'invitee-input'
- inputText: 'bob@example.com'
# Retype until the field (whose value Maestro reads as its text) holds the
# whole address. XCTest typing can drop letters on a loaded runner (see
# flow 07), and on the shard where 04a connected device Contacts, Return
# on a partial address takes the top suggestion instead: run 37944409989
# added "Kate Bell". Spare backspaces are harmless — there is no chip yet.
# The field proves the typing and a failed wait retypes (the same shape
# as flow 07).
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            true: ${output.retype === true}
          commands:
            - eraseText: 40
            - inputText: 'bob@example.com'
      - evalScript: ${output.retype = true}
      - extendedWaitUntil:
          visible:
            id: 'invitee-input'
            text: 'bob@example.com'
          timeout: 3000
# Return turns the address into a chip; the input clears.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'invitee-chip'
    timeout: 5000
- assertVisible: 'bob@example.com'
# Nothing is saved: leave the sheet as we found it.
- tapOn: 'Cancel'
- assertVisible: 'Today'
