appId: com.solunivo.app
name: First connection asks for Reminders and Contacts permission
tags:
  - ci
  - ci-permissions
---
# Run on a test install with no Apple account connected yet (before flow
# 10). Unlike ordinary launchApp, unset does not silently pre-grant access.
# Check denial guidance before exercising recovery with a retained account.
# Recover without another launchApp: its default would pre-grant access.
- launchApp:
    permissions:
      reminders: unset
      contacts: unset
- runFlow: ../common/await-shell.yaml
- tapOn:
    id: 'open-settings'
- assertVisible: 'Connect Contacts'
- tapOn:
    id: 'connect-reminders'
- assertVisible: '.*would like to access your Reminders.*'
- tapOn: 'Don’t Allow'
- assertVisible:
    id: 'open-device-settings'
- tapOn:
    id: 'connect-contacts'
- assertVisible: '.*would like to access your Contacts.*'
- tapOn: 'Don’t Allow'
- assertVisible: 'Contacts: Access denied.*'
- assertVisible:
    id: 'open-device-settings'
- tapOn: 'Done'

# A privacy reset keeps the Apple account in our database. Its presence
# must not hide the action that asks iOS for permission again.
- runFlow: ../common/launch.yaml
- tapOn:
    id: 'open-settings'
- tapOn:
    id: 'connect-reminders'
- extendedWaitUntil:
    visible: '^Apple Reminders$'
    timeout: 20000
- tapOn: 'Done'
- launchApp:
    permissions:
      reminders: unset
      contacts: allow
- runFlow: ../common/await-shell.yaml
- tapOn:
    id: 'open-settings'
- assertVisible: '^Apple Reminders$'
- tapOn:
    id: 'connect-reminders'
- assertVisible: '.*would like to access your Reminders.*'
- tapOn: 'Allow'
- extendedWaitUntil:
    notVisible:
      id: 'connect-reminders'
    timeout: 20000
- assertVisible: '^Apple Reminders$'
# Leave no Apple account so flow 10 still exercises the initial connection.
- tapOn: 'Remove'
- extendedWaitUntil:
    notVisible: '^Apple Reminders$'
    timeout: 20000
- tapOn: 'Done'
# Restore the ordinary suite's pre-granted permissions for subsequent flows.
- runFlow: ../common/launch.yaml
