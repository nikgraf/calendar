appId: com.solunivo.app.dev
name: First connection asks for Reminders and Contacts permission
tags:
  - ci
  - ci-permissions
---
# Run on a test install with no Apple account connected yet (before the
# sharded flows). Unlike ordinary launchApp, unset does not silently
# pre-grant access.
# Check denial guidance before exercising recovery with a retained account.
# Recover without another launchApp: its default would pre-grant access.
- launchApp:
    permissions:
      reminders: unset
      contacts: unset
- runFlow: ../common/await-shell.yaml
- runFlow: ../common/open-settings.yaml
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: device
- assertVisible:
    id: 'connect-contacts'
- tapOn:
    id: 'connect-reminders'
- assertVisible: '.*would like to access your Reminders.*'
- tapOn: 'Don’t Allow'
- assertVisible:
    id: 'open-device-settings'
- tapOn:
    id: 'connect-contacts'
- assertVisible: '.*would like to access your Contacts.*'
- tapOn: 'Don’t Allow'
- assertVisible: 'Contacts: Access denied.*'
- assertVisible:
    id: 'open-device-settings'
- runFlow: ../common/close-settings.yaml

# A privacy reset keeps the Apple account in our database. Its presence
# must not hide the action that asks iOS for permission again.
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-settings.yaml
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: device
- tapOn:
    id: 'connect-reminders'
# The Reminders row's subtitle carries this id only while the account exists.
- extendedWaitUntil:
    visible:
      id: 'apple-reminders-account'
    timeout: 20000
- runFlow: ../common/close-settings.yaml
- launchApp:
    permissions:
      reminders: unset
      contacts: allow
- runFlow: ../common/await-shell.yaml
- runFlow: ../common/open-settings.yaml
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: device
- assertVisible:
    id: 'apple-reminders-account'
- tapOn:
    id: 'connect-reminders'
- assertVisible: '.*would like to access your Reminders.*'
- tapOn: 'Allow'
- extendedWaitUntil:
    notVisible:
      id: 'connect-reminders'
    timeout: 20000
- assertVisible:
    id: 'apple-reminders-account'
# Leave no Apple account so flow 09 still exercises the initial connection.
- scrollUntilVisible:
    element:
      id: 'remove-account-apple-reminders'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'remove-account-apple-reminders'
# Gone: the row just tapped disappears with the account (the access row
# may be scrolled off by now, so its absence would prove nothing), and
# the access row offers Connect again.
- extendedWaitUntil:
    notVisible:
      id: 'remove-account-apple-reminders'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'connect-reminders'
    direction: UP
    timeout: 10000
- runFlow: ../common/close-settings.yaml
# Restore the ordinary suite's pre-granted permissions for subsequent flows.
- runFlow: ../common/launch.yaml
