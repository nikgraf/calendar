appId: com.solunivo.app
name: Bootstrap the dev client onto Metro (CI only)
tags:
  - ci
  - ci-bootstrap
---
# CI installs a fresh EAS dev client, which opens on its launcher screen.
# Point it at the runner's Metro through the development-client URL once;
# afterwards the dev client reopens the last server by itself, so every
# other flow can `launchApp` normally. expo-dev-menu's onboarding sheet,
# its menu-at-launch and its floating button are switched off by
# prepare-simulator.sh (UserDefaults) before the app ever starts; the
# guards below only matter on a simulator prepared by hand.
# 127.0.0.1, not localhost: on a GitHub runner the simulator resolved
# localhost to IPv6 and never reached Metro ("Failed to load app").
#
# Launch the client first, then hand it the URL. Relying on the URL to
# launch the app was not reliable on a runner: in run 34851193180 the
# flow confirmed the "Open in Solunivo?" alert and no launch followed —
# Safari (left in front by the diagnostics step) kept the screen with a
# modal sheet and the job died on the final assertion. With the client
# already running and in front, confirming the alert delivers the URL to
# a live process (run 34860533099 on PR #63 still saw the alert; it may or
# may not appear), so confirm-open.yaml handles it either way.
- launchApp
- extendedWaitUntil:
    visible: 'Today|Enter URL manually|Recently opened'
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible: 'Today'
    commands:
      - openLink: 'solunivo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
      - runFlow: ../common/confirm-open.yaml
# The dev launcher gives each request 10 s; on a loaded runner the first
# attempt can still miss that even with the bundle warm. Its error screen
# offers "Reload" — retry a few times, each against a warmer Metro, the
# way a person would. The wait is optional so one slow attempt does not
# end the flow: the loop keeps recovering and the final assertion decides.
- repeat:
    times: 6
    commands:
      - extendedWaitUntil:
          visible: 'Today|There was a problem loading the project|Toggle performance monitor|Continue|Error loading app|http://127\.0\.0\.1:8081|Enter URL manually|Open'
          timeout: 60000
          optional: true
      # The "Open in Solunivo?" alert can arrive after confirm-open.yaml's
      # 15 s wait gave up: in run 35078237553 it showed up about 20 s after
      # the link and sat unconfirmed through all six rounds. While it is up,
      # Maestro sees only the alert (the launcher behind it is not in the
      # hierarchy), so no guard below can match. Confirm it here, first;
      # confirm-open taps "Open" once and cancels any stacked copies, and
      # this alert is the link's first delivery, not a repeat.
      - runFlow:
          when:
            visible: 'Open'
          commands:
            - runFlow: ../common/confirm-open.yaml
      # "Reload" and "Go home" exist on both the launcher's error screen and
      # the dev menu sheet, and the error view lingers in the accessibility
      # tree behind the loaded app — so each guard keys on text unique to
      # its screen, never on those two buttons. Taps are optional: the
      # screen a guard saw can move on by itself before the tap lands
      # (see common/launch.yaml); the loop re-waits.
      - runFlow:
          when:
            visible: 'Error loading app'
          commands:
            - tapOn:
                text: 'OK'
                optional: true
      - runFlow:
          when:
            visible: 'http://127\.0\.0\.1:8081'
          commands:
            - tapOn:
                text: 'http://127\.0\.0\.1:8081'
                optional: true
      - runFlow:
          when:
            visible: 'There was a problem loading the project'
          commands:
            - tapOn:
                text: 'Reload'
                optional: true
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn:
                text: 'Continue'
                optional: true
      - runFlow:
          when:
            visible: 'Toggle performance monitor'
          commands:
            - tapOn:
                optional: true
                point: '50%,15%'
      # The launcher home with nothing under "Recently opened": the URL
      # never reached the client (a launch request sat in SpringBoard for
      # a minute on one runner, and the launcher started blank). Send the
      # link again.
      - runFlow:
          when:
            visible: 'Enter URL manually'
            notVisible: 'Today|http://127\.0\.0\.1:8081|Open'
          commands:
            - openLink: 'solunivo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
            - runFlow: ../common/confirm-open.yaml
- extendedWaitUntil:
    visible: 'Today'
    timeout: 60000
- assertNotVisible: 'Toggle performance monitor'
