appId: com.solunivo.app.dev
name: Task chips render in the all-day lane and round-trip the editor
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-new-event.yaml
# The Event | Task toggle only exists in create mode.
- assertVisible:
    id: 'mode-task'
- runFlow: ../common/switch-to-task.yaml
# Saving needs a task list, which needs a signed-in account whose token
# carries the tasks scope. Everywhere else the flow is a no-op rather
# than a false failure — the same shape as 06/07.
- runFlow:
    when:
      visible:
        id: 'task-list-option'
    commands:
      - tapOn:
          id: 'task-title'
      # Distinctive full title: it is the flow's handle for every later
      # selector, because the chip's testID swaps from the local- temp id
      # to the server id the moment the createTask op pushes — ids are
      # unstable mid-flow, the title is not. ASCII only: unicode through
      # XCTest typing is a known flaky spot.
      - runFlow:
          file: ../common/type-text.yaml
          env:
            FIELD: 'task-title'
            TEXT: 'Solunivo e2e task to delete'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'New Task'
          timeout: 20000
      - extendedWaitUntil:
          visible: 'Solunivo e2e task to delete'
          timeout: 10000
      # Check it off and back on via the labeled checkbox — exercises the
      # toggle while leaving the account unchanged even if the delete
      # below fails. Its label names what a tap does, so the second tap
      # also proves the first one landed.
      - tapOn: 'Complete Solunivo e2e task to delete'
      - tapOn: 'Reopen Solunivo e2e task to delete'
      # A tap opens the detail; completion needs no form.
      - tapOn: 'Solunivo e2e task to delete'
      - extendedWaitUntil:
          visible:
            id: 'task-detail-title'
            text: 'Solunivo e2e task to delete'
          timeout: 10000
      - assertNotVisible:
          id: 'editor-form'
      - tapOn:
          id: 'task-detail-complete'
      - extendedWaitUntil:
          visible: 'Reopen Solunivo e2e task to delete'
          timeout: 10000
      - tapOn: 'Solunivo e2e task to delete'
      - runFlow: ../common/open-task-editor.yaml
      # Checking off an edited form must leave a way to keep typing.
      - tapOn: 'Notes'
      - inputText: 'Draft note'
      - tapOn:
          id: 'task-editor-completion'
      - tapOn: 'Keep Editing'
      - assertVisible: 'Draft note'
      - tapOn:
          id: 'task-editor-completion'
      - tapOn: 'Mark as Incomplete'
      - extendedWaitUntil:
          visible: 'Complete Solunivo e2e task to delete'
          timeout: 10000
      - tapOn: 'Solunivo e2e task to delete'
      - extendedWaitUntil:
          visible:
            id: 'task-detail'
          timeout: 10000
      - tapOn:
          id: 'task-detail-delete'
      # Both the detail and the confirmation have Delete: take the alert's button.
      - extendedWaitUntil:
          visible: 'Delete .Solunivo e2e task to delete.\?'
          timeout: 10000
      - tapOn:
          text: 'Delete'
          below: 'Delete .Solunivo e2e task to delete.\?'
      # Deleting an unpushed create sends nothing to Google; a pushed one
      # deletes server-side — either way the account ends clean.
      - extendedWaitUntil:
          notVisible: 'Solunivo e2e task to delete'
          timeout: 20000
      - evalScript: ${output.sheetClosed = true}
# The fallback keys on the sheet still being open, not on the list rows:
# after the branch above the sheet is closed, so "no list rows" would be
# true for the wrong reason and the Cancel tap would fail. The branch
# says so in a flag rather than the fallback looking for "New Task":
# Maestro gives a `when` condition up to 7 s to come true, so `visible:`
# on a sheet that is gone cost that after every save.
- runFlow:
    when:
      true: ${output.sheetClosed !== true}
    commands:
      # No tasks-enabled account: leave the sheet as we found it.
      - tapOn: 'Cancel'
      - assertVisible: 'Today'
