appId: com.solunivo.app
name: Task chips render in the all-day lane and round-trip the editor
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- tapOn:
    id: 'add-event'
- assertVisible: 'New Event'
# The Event | Task toggle only exists in create mode.
- assertVisible:
    id: 'mode-task'
- tapOn:
    id: 'mode-task'
- assertVisible: 'New Task'
# Saving needs a task list, which needs a signed-in account whose token
# carries the tasks scope. Everywhere else the flow is a no-op rather
# than a false failure — the same shape as 06/07.
- runFlow:
    when:
      visible:
        id: 'task-list-option'
    commands:
      - tapOn:
          id: 'task-title'
      # Distinctive full title: it is the flow's handle for every later
      # selector, because the chip's testID swaps from the local- temp id
      # to the server id the moment the createTask op pushes — ids are
      # unstable mid-flow, the title is not. ASCII only: unicode through
      # XCTest typing is a known flaky spot.
      - inputText: 'Solunivo e2e task to delete'
      - tapOn:
          id: 'event-save'
      - extendedWaitUntil:
          notVisible: 'New Task'
          timeout: 20000
      - extendedWaitUntil:
          visible: 'Solunivo e2e task to delete'
          timeout: 10000
      # Check it off and back on via the labeled checkbox — exercises the
      # toggle while leaving the account unchanged even if the delete
      # below fails.
      - tapOn: 'Toggle Solunivo e2e task to delete'
      - tapOn: 'Toggle Solunivo e2e task to delete'
      # The chip title sits inside the body pressable: tapping it opens
      # the shared editor in task mode. (The full-title pattern cannot
      # match the "Toggle …"-prefixed checkbox label.)
      - tapOn: 'Solunivo e2e task to delete'
      # The first list may be a Google list or, once Reminders is
      # connected, the Apple one — either editor is the right outcome.
      - assertVisible: 'Edit (Task|Reminder)'
      - tapOn:
          id: 'task-delete'
      # Deleting an unpushed create sends nothing to Google; a pushed one
      # deletes server-side — either way the account ends clean.
      - extendedWaitUntil:
          notVisible: 'Solunivo e2e task to delete'
          timeout: 20000
# The fallback keys on the sheet still being open, not on the list rows:
# after the branch above the sheet is closed, so "no list rows" would be
# true for the wrong reason and the Cancel tap would fail.
- runFlow:
    when:
      visible: 'New Task'
    commands:
      # No tasks-enabled account: leave the sheet as we found it.
      - tapOn: 'Cancel'
      - assertVisible: 'Today'
