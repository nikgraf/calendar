appId: com.solunivo.app.dev
name: A calendar mirror is made in Settings, copies land, and deleting it removes them
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-settings.yaml
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'mirror-add'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'mirror-add'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'mirror-name'
- inputText: 'Family'
# The keyboard would cover the rows below (Maestro's visibility ignores it).
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'mirror-source-google-fixture-solunivo-test-mock-calendar'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'mirror-source-google-fixture-solunivo-test-mock-calendar'
- scrollUntilVisible:
    element:
      id: 'mirror-destination-google-fixture-solunivo-test-mock-shared'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'mirror-destination-google-fixture-solunivo-test-mock-shared'
# The preview says what others would see: the title and the place.
- scrollUntilVisible:
    element:
      id: 'mirror-preview'
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible: 'Fixture planning · Room 4.*'
    timeout: 10000
- tapOn:
    id: 'mirror-save'
# The editor closes; the new mirror's row then pushes "Add mirror" below
# the sheet's fold, so scroll to it rather than wait for it in place
# (run 37298882532).
- extendedWaitUntil:
    notVisible:
      id: 'mirror-save'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'mirror-add'
    direction: DOWN
    timeout: 10000
# The copies land through the fake API and the row reports it.
- extendedWaitUntil:
    visible: 'Up to date — 1 event mirrored.'
    timeout: 20000
# Leave the settings as found for the next flow. The row's action line
# sits at the sheet's bottom edge after the scroll above; XCTest reports a
# clipped control as visible, so it is centred first or the tap lands on
# nothing (CI run 37073975532).
- scrollUntilVisible:
    element:
      id: 'mirror-delete-.*'
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: 'mirror-delete-.*'
- extendedWaitUntil:
    visible: 'Delete and remove copies'
    timeout: 5000
- tapOn: 'Delete and remove copies'
- extendedWaitUntil:
    notVisible: 'Up to date — 1 event mirrored.'
    timeout: 10000
- tapOn: 'Done'
- assertVisible: 'Today'
