appId: com.solunivo.app.dev
name: A calendar mirror is made in Settings, copies land, and deleting it removes them
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-settings.yaml
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: mirrors
# Listed under "Experimental" on the root, and the page says so.
- assertVisible:
    id: 'experimental-note'
- scrollUntilVisible:
    element:
      id: 'mirror-add'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'mirror-add'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'mirror-name'
- inputText: 'Family'
# The keyboard would cover the rows below (Maestro's visibility ignores it).
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'mirror-source-google-fixture-solunivo-test-mock-calendar'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'mirror-source-google-fixture-solunivo-test-mock-calendar'
- scrollUntilVisible:
    element:
      id: 'mirror-destination-google-fixture-solunivo-test-mock-shared'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'mirror-destination-google-fixture-solunivo-test-mock-shared'
# The preview says what others would see: the title and the place.
- scrollUntilVisible:
    element:
      id: 'mirror-preview'
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible: 'Fixture planning · Room 4.*'
    timeout: 10000
- tapOn:
    id: 'mirror-save'
- extendedWaitUntil:
    notVisible:
      id: 'mirror-save'
    timeout: 10000
# The copies land through the fake API and the mirror's row reports it
# (one element: the row reads as its name, status and On together). The
# count is whatever the source holds by now: an earlier flow that failed
# before its clean-up leaves its event there (run 37314663224 mirrored 2).
- scrollUntilVisible:
    element:
      id: 'mirror-row-.*'
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible: '.*Up to date — [1-9][0-9]* events? mirrored\..*'
    timeout: 20000
# Leave the settings as found for the next flow: delete it from its page.
- tapOn:
    id: 'mirror-row-.*'
- extendedWaitUntil:
    visible:
      id: 'settings-page-mirror'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
# No centerElement: the page runs to the screen edge, so a frame-visible
# row is tappable, and a page short enough not to scroll can never centre
# its last row (CI run 37852137291 waited out the timeout on it).
- scrollUntilVisible:
    element:
      id: 'mirror-delete-.*'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'mirror-delete-.*'
- extendedWaitUntil:
    visible: 'Delete and remove copies'
    timeout: 5000
- tapOn: 'Delete and remove copies'
# Gone, and back on the list.
- extendedWaitUntil:
    visible:
      id: 'settings-page-mirrors'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: 'mirror-row-.*'
    timeout: 10000
- runFlow: ../common/close-settings.yaml
