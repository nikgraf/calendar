appId: com.solunivo.app
name: The invitee field turns a typed address into a chip
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- tapOn:
    id: 'add-event'
- assertVisible: 'New Event'
- waitForAnimationToEnd:
    timeout: 5000
# The title auto-focuses, so its keyboard is up and covers the invitee
# field (its top edge is right where the keyboard starts on an iPhone 17
# Pro). Maestro's visibility check does not know about the keyboard, so
# a tap "on the input" lands on the predictive bar and the text goes into
# the title. Dismiss the keyboard first: a tap on a plain label is not
# handled by any child, so keyboardShouldPersistTaps="handled" lets the
# ScrollView resign it.
- tapOn: 'INVITEES'
- waitForAnimationToEnd:
    timeout: 5000
# The field sits below the location row; scroll it into view.
- scrollUntilVisible:
    element:
      id: 'invitee-input'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'invitee-input'
- inputText: 'bob@example.com'
# Return turns the address into a chip; the input clears.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'invitee-chip'
    timeout: 5000
- assertVisible: 'bob@example.com'
# Nothing is saved: leave the sheet as we found it.
- tapOn: 'Cancel'
- assertVisible: 'Today'
