appId: com.solunivo.app.dev
name: View switching and date navigation
tags:
  - ci
---
- runFlow: ../common/launch.yaml
# Same as the gear in open-settings.yaml: a tap taken right after launch
# can report COMPLETED with nothing switching (runs 37104577969 and its
# rerun sat on the day view). Re-tap while the month title is missing.
# Month view titles are "July 2026"-style.
- repeat:
    times: 3
    while:
      notVisible: '.* 20\d\d'
    commands:
      - tapOn: 'Month'
      - extendedWaitUntil:
          visible: '.* 20\d\d'
          timeout: 5000
          optional: true
- assertVisible:
    text: '.* 20\d\d'
- tapOn: '2 Days'
# Two-day titles are "Sep 28 – 29, 2026" or "Sep 30 – Oct 1, 2026".
- assertVisible:
    text: '.* – .*, 20\d\d'
- assertVisible:
    id: 'day-timeline'
- tapOn: 'Week'
# Week titles are "September 7 – 13, 2026" or "Aug 31 – Sep 6, 2026".
- assertVisible:
    text: '.* – .*, 20\d\d'
- assertVisible:
    id: 'day-timeline'
- tapOn: 'Day'
- tapOn:
    id: 'nav-next'
- tapOn:
    id: 'nav-prev'
- tapOn: 'Today'
- assertVisible: 'Day'
