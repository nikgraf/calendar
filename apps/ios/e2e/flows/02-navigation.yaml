appId: com.solunivo.app.dev
name: View switching and date navigation
tags:
  - ci
---
- runFlow: ../common/launch.yaml
# Month view titles are "July 2026"-style.
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: 'Month'
- assertVisible:
    text: '.* 20\d\d'
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: '2 Days'
# Two-day titles are "Sep 28 – 29, 2026" or "Sep 30 – Oct 1, 2026".
- assertVisible:
    text: '.* – .*, 20\d\d'
- assertVisible:
    id: 'day-timeline'
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: 'Week'
# Week titles are "September 7 – 13, 2026" or "Aug 31 – Sep 6, 2026".
- assertVisible:
    text: '.* – .*, 20\d\d'
- assertVisible:
    id: 'day-timeline'
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: 'Day'
- tapOn:
    id: 'nav-next'
- tapOn:
    id: 'nav-prev'
- tapOn:
    id: 'today'
# The agenda lists two weeks from the focused day.
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: 'Agenda'
- assertVisible:
    id: 'agenda-list'
- runFlow:
    file: ../common/switch-view.yaml
    env:
      VIEW: 'Day'
- assertVisible:
    id: 'day-timeline'
# Settings opens from the Tasks tab too: the account button sits at the
# top right of both tabs. Done brings back the tab it opened from.
- tapOn: 'Tasks'
- assertVisible:
    id: 'tasks-screen'
- runFlow: ../common/open-settings.yaml
- tapOn: 'Done'
- assertVisible:
    id: 'tasks-screen'
- tapOn: 'Calendar'
- assertVisible:
    id: 'day-timeline'
