appId: com.solunivo.app.dev
name: View switching and date navigation
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- tapOn: 'Month'
# Month view titles are "July 2026"-style.
- assertVisible:
    text: '.* 20\d\d'
- tapOn: '2 Days'
# Two-day titles are "Sep 28 – 29, 2026" or "Sep 30 – Oct 1, 2026".
- assertVisible:
    text: '.* – .*, 20\d\d'
- assertVisible:
    id: 'day-timeline'
- tapOn: 'Week'
# Week titles are "September 7 – 13, 2026" or "Aug 31 – Sep 6, 2026".
- assertVisible:
    text: '.* – .*, 20\d\d'
- assertVisible:
    id: 'day-timeline'
- tapOn: 'Day'
- tapOn:
    id: 'nav-next'
- tapOn:
    id: 'nav-prev'
- tapOn: 'Today'
- assertVisible: 'Day'
