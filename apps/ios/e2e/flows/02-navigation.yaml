appId: com.solunivo.app
name: View switching and date navigation
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- tapOn: 'Month'
# Month view titles are "July 2026"-style.
- assertVisible:
    text: '.* 20\d\d'
- tapOn: 'Day'
- tapOn:
    id: 'nav-next'
- tapOn:
    id: 'nav-prev'
- tapOn: 'Today'
- assertVisible: 'Day'
