appId: com.solunivo.app.dev
name: Settings export opens the share sheet and import opens the file picker
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-settings.yaml
- runFlow:
    file: ../common/open-settings-page.yaml
    env:
      PAGE: advanced
- assertVisible:
    id: 'settings-file'
- assertVisible:
    id: 'settings-file-import'
- tapOn:
    id: 'settings-file-export'
# The system share sheet. It titles the file without its extension and,
# while it is up, the app's own elements leave the accessibility tree —
# so the sheet's "Save to Files" action is the marker, not the file name
# and not the section behind it.
# A slow runner draws the sheet blank for over ten seconds before its
# actions appear (run 37296818448, twice).
- extendedWaitUntil:
    visible: 'Save to Files'
    timeout: 30000
# No "Close" control on iOS 26: dragging the sheet down from inside it
# dismisses it (a swipe from the screen centre starts above the sheet).
- repeat:
    times: 3
    while:
      visible: 'Save to Files'
    commands:
      - swipe:
          start: 50%, 62%
          end: 50%, 97%
      - waitForAnimationToEnd:
          timeout: 3000
- assertNotVisible: 'Save to Files'
# Still on the Advanced page: the drag closed the share sheet, not Settings.
- assertVisible:
    id: 'settings-file-export'
# Import hands off to the system document picker (any file type; the
# parser judges the contents). Opening and cancelling it is as far as a
# simulator without a seeded Files provider can go.
- tapOn:
    id: 'settings-file-import'
- extendedWaitUntil:
    visible: 'Browse'
    timeout: 10000
# The picker's close button grows into place: "Browse" is already there
# while "Cancel" is still 1 pt wide, and a tap on it then reports done
# and closes nothing (run 36995872243). Let the picker settle, and tap
# again for as long as it is up.
- repeat:
    times: 3
    while:
      visible: 'Browse'
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: 'Cancel'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'settings-file-import'
    timeout: 5000
- runFlow: ../common/close-settings.yaml
