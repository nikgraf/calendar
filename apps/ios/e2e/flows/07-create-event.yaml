appId: com.solunivo.app.dev
name: Saving a new event writes it to the day
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-new-event.yaml
# Saving needs a writable calendar, so this runs only where an account is
# signed in. Everywhere else the flow is a no-op rather than a false
# failure — the same shape as the quick-add flow.
- runFlow:
    when:
      visible:
        id: 'calendar-option'
    commands:
      - tapOn:
          id: 'calendar-option'
          index: 0
      - tapOn:
          id: 'event-title'
      # Named so a leftover is recognisable: this writes to the real
      # Google account the device is signed into, and is deleted below.
      # ASCII only — unicode through XCTest typing is a known flaky spot —
      # and retyped until the field holds it ("Snivo …" in run 37314663224,
      # "Sunivo … deleteol" before), so the checks below test saving.
      - runFlow:
          file: ../common/type-text.yaml
          env:
            FIELD: 'event-title'
            TEXT: 'Solunivo e2e event to delete'
      # Notes sit at the bottom of the form. Dismiss the title's keyboard
      # first, or the text lands in the title.
      - runFlow:
          file: ../common/dismiss-keyboard.yaml
          env:
            LABEL: 'Starts'
      - scrollUntilVisible:
          element:
            id: 'event-notes'
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: 'event-notes'
      - runFlow:
          file: ../common/type-text.yaml
          env:
            FIELD: 'event-notes'
            TEXT: 'Bring the agenda'
      - tapOn:
          id: 'event-save'
      # The sheet closes only after the whole create path ran, id
      # generation included — that is the step that used to die with
      # "Property 'crypto' doesn't exist" on a release build.
      - extendedWaitUntil:
          notVisible: 'New Event'
          timeout: 20000
      # Maestro patterns match the whole string. A timed block's label is
      # its title and time range ("…, 9:00 AM – 10:00 AM"), like flow 09's
      # reminder label, so match the title as a prefix.
      - extendedWaitUntil:
          visible: 'Solunivo e2e event to delete.*'
          timeout: 10000
      # Clean up, so repeated runs don't pile up in a real calendar.
      - tapOn: 'Solunivo e2e event to delete.*'
      # The detail sheet reads the notes back from the saved event.
      - extendedWaitUntil:
          visible:
            id: 'event-detail-notes'
            text: 'Bring the agenda'
          timeout: 10000
      - assertNotVisible:
          id: 'apple-maps-directions'
      - assertNotVisible:
          id: 'google-maps-directions'
      - runFlow: ../common/open-event-editor.yaml
      # Edit turned the detail into the editor in the same sheet; Cancel
      # turns it back (the editor fades out, so wait for it to go).
      - tapOn: 'Cancel'
      - extendedWaitUntil:
          visible:
            id: 'event-detail-notes'
            text: 'Bring the agenda'
          timeout: 10000
      - extendedWaitUntil:
          notVisible: 'Edit Event'
          timeout: 10000
      - runFlow: ../common/open-event-editor.yaml
      # Free text needs no geocoder or network to offer directions. CI
      # disables geo; this checks the detail's links before any lookup.
      # The row opens the location screen; Done keeps the text as typed.
      - scrollUntilVisible:
          element:
            id: 'location-field'
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: 'location-field'
      - inputText: 'Museumsplatz 1, Vienna'
      - tapOn:
          id: 'location-done'
      - tapOn:
          id: 'event-save'
      # Saving closes the sheet; reopen the event to read the saved place.
      - extendedWaitUntil:
          notVisible: 'Edit Event'
          timeout: 10000
      - tapOn: 'Solunivo e2e event to delete.*'
      - extendedWaitUntil:
          visible:
            id: 'apple-maps-directions'
          timeout: 10000
      - assertVisible:
          id: 'google-maps-directions'
      - runFlow: ../common/open-event-editor.yaml
      # Delete is the form's last card: scroll it into reach.
      - scrollUntilVisible:
          element:
            id: 'event-delete'
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: 'event-delete'
      # The confirmation alert (deleteQuestion).
      - tapOn: 'Delete'
      - extendedWaitUntil:
          notVisible: 'Solunivo e2e event to delete.*'
          timeout: 20000
      - evalScript: ${output.sheetClosed = true}
# Keyed on the sheet still being open (see 08, also for the flag): after
# a save the sheet is closed and "no calendar rows" would be true for the
# wrong reason.
- runFlow:
    when:
      true: ${output.sheetClosed !== true}
    commands:
      # No account: leave the sheet as we found it.
      - tapOn: 'Cancel'
      - assertVisible: 'Today'
