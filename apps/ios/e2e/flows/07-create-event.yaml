appId: com.solunivo.app
name: Saving a new event writes it to the day
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- tapOn:
    id: 'add-event'
- assertVisible: 'New Event'
# Saving needs a writable calendar, so this runs only where an account is
# signed in. Everywhere else the flow is a no-op rather than a false
# failure — the same shape as the quick-add flow.
- runFlow:
    when:
      visible:
        id: 'calendar-option'
    commands:
      - tapOn:
          id: 'calendar-option'
          index: 0
      - tapOn:
          id: 'event-title'
      # Named so a leftover is recognisable: this writes to the real
      # Google account the device is signed into, and is deleted below.
      # ASCII only — unicode through XCTest typing is a known flaky spot.
      - inputText: 'Solunivo e2e event to delete'
      - tapOn:
          id: 'event-save'
      # The sheet closes only after the whole create path ran, id
      # generation included — that is the step that used to die with
      # "Property 'crypto' doesn't exist" on a release build.
      - extendedWaitUntil:
          notVisible: 'New Event'
          timeout: 20000
      # Maestro patterns match the whole string, so use the exact title.
      - assertVisible: 'Solunivo e2e event to delete'
      # Clean up, so repeated runs don't pile up in a real calendar.
      - tapOn: 'Solunivo e2e event to delete'
      - assertVisible: 'Edit Event'
      - tapOn:
          id: 'event-delete'
      - extendedWaitUntil:
          notVisible: 'Solunivo e2e event to delete'
          timeout: 20000
# Keyed on the sheet still being open (see 08): after a save the sheet is
# closed and "no calendar rows" would be true for the wrong reason.
- runFlow:
    when:
      visible: 'New Event'
    commands:
      # No account: leave the sheet as we found it.
      - tapOn: 'Cancel'
      - assertVisible: 'Today'
