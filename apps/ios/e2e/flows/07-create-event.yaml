appId: com.solunivo.app.dev
name: Saving a new event writes it to the day
tags:
  - ci
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/open-new-event.yaml
# Saving needs a writable calendar, so this runs only where an account is
# signed in. Everywhere else the flow is a no-op rather than a false
# failure — the same shape as the quick-add flow.
- runFlow:
    when:
      visible:
        id: 'calendar-option'
    commands:
      - tapOn:
          id: 'calendar-option'
          index: 0
      - tapOn:
          id: 'event-title'
      # Named so a leftover is recognisable: this writes to the real
      # Google account the device is signed into, and is deleted below.
      # ASCII only — unicode through XCTest typing is a known flaky spot.
      - inputText: 'Solunivo e2e event to delete'
      # XCTest typing can drop or move letters ("Snivo …" in run
      # 37314663224, "Sunivo … deleteol" before): retype until the field
      # (whose value Maestro reads as its text) holds the title, so the
      # checks below test saving rather than typing.
      #
      # The field proves the typing and a failed wait retypes; the flag
      # keeps the first pass from typing twice. A `while: notVisible:`
      # loop did this before, but Maestro waits up to 7 s (from the last
      # tap or typing) for a condition to come true, so its exit check,
      # with the title right, cost that every time.
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when:
                  true: ${output.retypeTitle === true}
                commands:
                  - tapOn: 'Clear text'
                  - inputText: 'Solunivo e2e event to delete'
            - evalScript: ${output.retypeTitle = true}
            - extendedWaitUntil:
                visible:
                  id: 'event-title'
                  text: 'Solunivo e2e event to delete'
                timeout: 3000
      # Notes sit at the bottom of the form. Dismiss the title's keyboard
      # first (a tap on a plain label above the keyboard, see 03), or the
      # text lands in the title.
      - tapOn: 'Starts'
      - scrollUntilVisible:
          element:
            id: 'event-notes'
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: 'event-notes'
      - inputText: 'Bring the agenda'
      # The field proves the typing and a failed wait retypes; the flag
      # keeps the first pass from typing twice. A `while: notVisible:`
      # loop would wait up to 7 s for its condition on every exit with the
      # notes right.
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when:
                  true: ${output.retypeNotes === true}
                commands:
                  - eraseText: 40
                  - inputText: 'Bring the agenda'
            - evalScript: ${output.retypeNotes = true}
            - extendedWaitUntil:
                visible:
                  id: 'event-notes'
                  text: 'Bring the agenda'
                timeout: 3000
      - tapOn:
          id: 'event-save'
      # The sheet closes only after the whole create path ran, id
      # generation included — that is the step that used to die with
      # "Property 'crypto' doesn't exist" on a release build.
      - extendedWaitUntil:
          notVisible: 'New Event'
          timeout: 20000
      # Maestro patterns match the whole string. A timed block's label is
      # its title and time range ("…, 9:00 AM – 10:00 AM"), like flow 09's
      # reminder label, so match the title as a prefix.
      - extendedWaitUntil:
          visible: 'Solunivo e2e event to delete.*'
          timeout: 10000
      # Clean up, so repeated runs don't pile up in a real calendar.
      - tapOn: 'Solunivo e2e event to delete.*'
      # The detail sheet reads the notes back from the saved event.
      - extendedWaitUntil:
          visible:
            id: 'event-detail-notes'
            text: 'Bring the agenda'
          timeout: 10000
      - runFlow: ../common/open-event-editor.yaml
      # Delete is the form's last card: scroll it into reach.
      - scrollUntilVisible:
          element:
            id: 'event-delete'
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: 'event-delete'
      # The confirmation alert (deleteQuestion).
      - tapOn: 'Delete'
      - extendedWaitUntil:
          notVisible: 'Solunivo e2e event to delete.*'
          timeout: 20000
      - evalScript: ${output.sheetClosed = true}
# Keyed on the sheet still being open (see 08, also for the flag): after
# a save the sheet is closed and "no calendar rows" would be true for the
# wrong reason.
- runFlow:
    when:
      true: ${output.sheetClosed !== true}
    commands:
      # No account: leave the sheet as we found it.
      - tapOn: 'Cancel'
      - assertVisible: 'Today'
