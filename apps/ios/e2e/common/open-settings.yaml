appId: com.solunivo.app.dev
name: Open Settings from the header's account button, on its root page (shared)
---
# Same failure as the "+" in open-new-event.yaml: on a slow runner a tap
# taken right after launch reports COMPLETED and no sheet follows (CI runs
# 35462596043 and 35457704053 sat on the day view for 20 s). Re-tap while
# the sheet is missing, the way a person would. By id, not the "Settings"
# title: the account button's own label starts with "Settings" too.
#
# The sheet proves the tap (see open-new-event.yaml): the guard is true
# while no sheet is up, so it answers at once, and it keeps a sheet that
# came up late from taking a second tap.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'settings-root'
          commands:
            - tapOn:
                id: 'open-settings'
      - extendedWaitUntil:
          visible:
            id: 'settings-root'
          timeout: 5000
# The sheet slides in; a tap taken mid-animation misses.
- waitForAnimationToEnd:
    timeout: 5000
