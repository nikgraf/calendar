appId: com.solunivo.app.dev
name: Search for QUERY in the Search tab until RESULT shows (shared)
---
# The system search field (in the tab bar on iOS 26) is found by its
# placeholder, which stays its label while it holds text. A fresh
# simulator may show the keyboard's one-time "slide to type" card; it is
# dismissed before typing again.
#
# XCTest typing can drop or move letters (flow 07): type it again until
# the result shows.
#
# The result proves the search and a failed wait types again; the card is
# looked for only then. Maestro waits up to 7 s (from the last tap) for a
# `while`/`when` condition to come true, so guards for a card that is not
# there and a retype loop's exit check cost ~20 s per call. Whether the
# field holds an earlier query is read from its text, the placeholder
# while it is empty, instead of waiting for a "Clear text" that is not
# there.
- evalScript: ${output.searchTyped = false}
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            true: ${output.searchTyped}
          commands:
            - runFlow:
                when:
                  visible: 'Continue'
                commands:
                  - tapOn: 'Continue'
      - evalScript: ${output.searchTyped = true}
      - tapOn: 'Events and tasks'
      - copyTextFrom: 'Events and tasks'
      - runFlow:
          when:
            true: ${maestro.copiedText !== 'Events and tasks'}
          commands:
            - tapOn: 'Clear text'
      - inputText: ${QUERY}
      - extendedWaitUntil:
          visible: ${RESULT}
          timeout: 10000
