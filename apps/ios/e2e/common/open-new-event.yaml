appId: com.solunivo.app.dev
name: Open the editor on a new event from the "+" button (shared)
---
# The "+" opens the editor on a new event: the quick-add field on top (no
# model involved until it is used), the kind control, the form. One tap
# normally does it. Run 34852090635 tapped the button at the right
# coordinates and no sheet followed (the screen stayed on the day view,
# nothing crashed); re-tap while the sheet is missing, the way a person
# would.
- repeat:
    times: 3
    while:
      notVisible: 'New Event'
    commands:
      - tapOn:
          id: 'add'
      - extendedWaitUntil:
          visible: 'New Event'
          timeout: 5000
          optional: true
- assertVisible: 'New Event'
# The sheet slides in; on a slow runner a tap taken mid-animation misses.
- waitForAnimationToEnd:
    timeout: 5000
