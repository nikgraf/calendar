appId: com.solunivo.app.dev
name: Open the editor's form on a new event from the "+" button (shared)
---
- runFlow: open-new-item.yaml
# A new event opens on the Assistant where a model answers, and on the
# form where none does (the editor falls back once the availability check
# has answered). Each view shows the way to the other only then, so
# either one proves the check is back; the flows work the form, so take
# the way to it when it is the Assistant that is up. Where the form is up
# already this guard waits out its 7 s — a local run without the fixture
# model only; CI's bundle answers with it.
- extendedWaitUntil:
    visible:
      id: 'editor-view-(form|assistant)'
    timeout: 30000
- runFlow:
    when:
      visible:
        id: 'editor-view-form'
    commands:
      - tapOn:
          id: 'editor-view-form'
      - extendedWaitUntil:
          visible:
            id: 'editor-view-assistant'
          timeout: 5000
      # The form rises out of the conversation (280 ms): a tap taken
      # while it moves lands where a field was.
      - waitForAnimationToEnd:
          timeout: 3000
