appId: com.solunivo.app
name: Switch the open new-event sheet to the task form (shared)
---
# Run 35425328496: the mode tap reported COMPLETED and the sheet stayed on
# "New Event". Re-tap while the task form is missing.
- repeat:
    times: 3
    while:
      notVisible: 'New Task'
    commands:
      - tapOn:
          id: 'mode-task'
      # A timed draft heading for a Google list (date-only) asks about its
      # time; the fixture account's list comes first, so answer it.
      - extendedWaitUntil:
          visible: 'Switch to task?'
          timeout: 3000
          optional: true
      - runFlow:
          when:
            visible: 'Switch to task?'
          commands:
            - tapOn: 'Switch'
      - extendedWaitUntil:
          visible: 'New Task'
          timeout: 5000
          optional: true
- assertVisible: 'New Task'
