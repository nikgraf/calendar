appId: com.solunivo.app.dev
name: Switch the open new-event sheet to the task form (shared)
---
# Run 35425328496: the mode tap reported COMPLETED and the sheet stayed on
# "New Event". Re-tap while the task form is missing. The form's title
# proves the tap, the same shape as open-new-event.yaml.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: 'New Task'
          commands:
            - tapOn:
                id: 'mode-task'
      - extendedWaitUntil:
          visible: 'New Task'
          timeout: 5000
